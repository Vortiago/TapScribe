<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TapScribe · Stages</title>
    <link rel="stylesheet" href="stages.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- ============ SPINE (the ordered journey) ============ -->
      <aside class="spine" id="spine">
        <header class="spine__head">
          <div class="brand">
            <span class="brand__dot"></span>
            <span class="brand__name">TapScribe</span>
          </div>
          <!-- Taps: GLOBAL live ingress, pinned above the per-session journey -->
          <button class="gtap" id="tapsEntry" title="Taps — global live ingress">
            <span class="gtap__ic">🛰️</span>
            <span class="gtap__body">
              <span class="gtap__name">Taps</span>
              <span class="gtap__sub" id="tapsSub">— connected</span>
            </span>
            <span class="gtap__live"><span class="dot"></span><span id="tapsLiveN">—</span> live</span>
          </button>
          <div class="spine__div"><span>session</span></div>
          <!-- Session picker (switching re-seeds the journey) + New session -->
          <button class="sessionpick" id="sessionPick" aria-haspopup="listbox">
            <span class="sessionpick__live" id="sessionLive"></span>
            <span class="sessionpick__body">
              <span class="sessionpick__label" id="sessionLabel">Nordic Sync</span>
              <span class="sessionpick__meta" id="sessionMeta">— · — clips</span>
            </span>
            <span class="sessionpick__chev">⌄</span>
          </button>
          <div class="sessionmenu" id="sessionMenu" hidden></div>
          <button class="newsession" id="newSession" title="Start a new session">
            <span class="newsession__plus">+</span><span class="newsession__lab">New session</span>
          </button>
        </header>

        <nav class="stages" id="stagesNav" aria-label="Session stages"></nav>

        <footer class="spine__foot">
          <div class="journey" id="journeyBar">
            <div class="journey__fill" id="journeyFill"></div>
          </div>
          <div class="journey__cap" id="journeyCap">Session journey</div>
        </footer>
      </aside>

      <!-- ============ WORKSPACE (one stage at a time) ============ -->
      <main class="work" id="work">
        <div class="work__inner" id="workInner"><!-- stage rendered here --></div>
      </main>
    </div>

    <script type="module" src="stages.js"></script>
  </body>
</html>
