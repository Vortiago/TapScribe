<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TapScribe · Glance → Focus</title>
    <link rel="stylesheet" href="glance.css" />
  </head>
  <body>
    <div id="app" data-mode="glance" data-focus="">
      <!-- Top bar: identity + recorder state + clock -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">TapScribe</span>
          <span class="brand-sub">Glance → Focus</span>
        </div>
        <button class="back-btn" id="backBtn" type="button" hidden>
          <span class="back-arrow" aria-hidden="true">←</span> Glance
        </button>
        <div class="topbar-right">
          <span class="rec-pill" id="recPill" title="Recording enabled">
            <span class="rec-dot" aria-hidden="true"></span> REC
          </span>
          <span class="clock" id="wallClock">09:48</span>
        </div>
      </header>

      <!-- The single stage. In glance mode it renders 5 wide digest cards.
           In focus mode it splits into [rail | workspace]. JS swaps content. -->
      <main class="stage" id="stage"></main>
    </div>

    <script type="module" src="glance.js"></script>
  </body>
</html>
