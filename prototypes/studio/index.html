<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TapScribe Studio</title>
  <link rel="stylesheet" href="./studio.css" />
</head>
<body>
  <div id="app" class="app" data-view="overview">
    <!-- ===================== TRANSPORT BAR ===================== -->
    <header class="transport">
      <div class="transport__brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="28" height="28">
            <rect x="2" y="11" width="3" height="6" rx="1.5" fill="currentColor"/>
            <rect x="7" y="7" width="3" height="14" rx="1.5" fill="currentColor"/>
            <rect x="12" y="3" width="3" height="22" rx="1.5" fill="currentColor"/>
            <rect x="17" y="8" width="3" height="12" rx="1.5" fill="currentColor"/>
            <rect x="22" y="11" width="3" height="6" rx="1.5" fill="currentColor"/>
          </svg>
        </span>
        <div class="transport__title">
          <div class="transport__session" id="sessionName">Nordic Sync</div>
          <div class="transport__meta" id="sessionMeta">2026-05-28 · mixed nb / da / en</div>
        </div>
      </div>

      <div class="transport__controls">
        <button class="tbtn" id="btnSkipBack" title="Jump to start" aria-label="Jump to start">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 5v14M19 5l-9 7 9 7z" fill="currentColor"/></svg>
        </button>
        <button class="tbtn tbtn--play" id="btnPlay" title="Play / Pause" aria-label="Play or pause">
          <svg class="ic-play" viewBox="0 0 24 24" width="20" height="20"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24" width="20" height="20"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <button class="tbtn" id="btnSkipFwd" title="Jump to end" aria-label="Jump to end">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 5v14M5 5l9 7-9 7z" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="transport__time">
        <div class="tc tc--playhead" id="playheadTc">0:14:02</div>
        <div class="tc__sep">/</div>
        <div class="tc tc--total" id="totalTc">0:48:00</div>
      </div>

      <div class="transport__right">
        <div class="recpill" id="recPill" title="Recording armed">
          <span class="recpill__dot"></span><span class="recpill__txt">REC</span>
        </div>
        <div class="zoom">
          <span class="zoom__lbl">Zoom</span>
          <button class="zoom__btn" id="zoomOut" aria-label="Zoom out">–</button>
          <div class="zoom__track"><div class="zoom__fill" id="zoomFill"></div></div>
          <button class="zoom__btn" id="zoomIn" aria-label="Zoom in">+</button>
        </div>
        <button class="ghostbtn" id="openProfiles">Inputs &amp; Presets</button>
      </div>
    </header>

    <!-- ===================== TAB STRIP ===================== -->
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="overview">Timeline</button>
      <button class="tab" data-view="strip">Strip-silence</button>
      <button class="tab" data-view="diarization">Diarization</button>
      <button class="tab" data-view="profiles">Inputs &amp; Presets</button>
      <button class="tab" data-view="transcript">Transcript</button>
    </nav>

    <!-- ===================== WORKSPACE ===================== -->
    <main class="workspace">
      <!-- center timeline (track headers + lanes), hidden on transcript view -->
      <section class="stage" id="stage">
        <!-- RULER -->
        <div class="ruler">
          <div class="ruler__corner">
            <span class="ruler__sessions" id="sessionPicker">Sessions ▾</span>
          </div>
          <canvas class="ruler__canvas" id="rulerCanvas"></canvas>
        </div>

        <!-- TRACK ROWS -->
        <div class="tracks" id="tracks"><!-- built by JS --></div>

        <!-- LIVE LOG (docked bottom) -->
        <div class="livelog" id="livelog">
          <div class="livelog__head">
            <span class="livelog__title"><span class="livelog__pulse"></span> Live captions</span>
            <span class="livelog__sub" id="liveStatus">2 taps live · canary-1b-v2 → en</span>
          </div>
          <div class="livelog__body" id="liveBody"><!-- built by JS --></div>
        </div>
      </section>

      <!-- right INSPECTOR -->
      <aside class="inspector" id="inspector"><!-- built by JS --></aside>
    </main>

    <!-- ===================== TRANSCRIPT VIEW ===================== -->
    <section class="transcript-view" id="transcriptView"><!-- built by JS --></section>

    <!-- ===================== PROFILES MODAL ===================== -->
    <div class="modal" id="profilesModal" hidden>
      <div class="modal__scrim" id="modalScrim"></div>
      <div class="modal__card" role="dialog" aria-label="Inputs and presets">
        <div class="modal__head">
          <div>
            <div class="modal__title">Inputs &amp; Presets</div>
            <div class="modal__sub">Per-microphone profiles — gate, floor &amp; language reused across every session</div>
          </div>
          <button class="modal__close" id="modalClose" aria-label="Close">✕</button>
        </div>
        <div class="modal__body" id="presetGrid"><!-- built by JS --></div>
      </div>
    </div>
  </div>

  <script type="module" src="./studio.js"></script>
</body>
</html>
