<template id="tpl-feed-empty">
  <div class="feed-empty">
    <div class="ascii">┌──────────────────────┐
│   ▁ ▂ ▃ ▄ ▅ ▆ ▇ █    │
│       awaiting       │
└──────────────────────┘</div>
    <div>no live transcripts yet</div>
    <div class="dim tiny mt-s">speak in the bridged tab — settled lines arrive here</div>
  </div>
</template>

<!-- Empty state for an ARCHIVED (non-current) session: captions are ephemeral
     and only flow into the live session, so this one will never fill — point
     the operator at the durable merged Transcript instead. -->
<template id="tpl-feed-archived">
  <div class="feed-empty">
    <div class="ascii">┌──────────────────────┐
│   ░ ░ ░ ░ ░ ░ ░ ░    │
│       archived       │
└──────────────────────┘</div>
    <div>this session isn't recording</div>
    <div class="dim tiny mt-s">live captions appear only while a session is live — this session's text is in the Transcript stage</div>
  </div>
</template>

<template id="tpl-feed-body">
  <div class="feed-body"></div>
</template>

<template id="tpl-feed-line">
  <div class="line">
    <span class="ts" data-slot="ts"></span>
    <span class="who" data-slot="who"></span>
    <span class="txt" data-slot="txt"></span>
  </div>
</template>
