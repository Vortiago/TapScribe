<template id="tpl-merged">
  <div class="box">
    <div class="box-hd">
      <span>merged transcript</span>
      <span class="spacer"></span>
      <span class="dim tnum tiny" data-slot="headerMeta"></span>
    </div>
    <div class="box-bd" style="padding:10px;">
      <div class="spk-bar" data-slot="spkBar" hidden></div>
      <div class="spk-legend" data-slot="spkLegend" hidden></div>
      <div class="dim tiny" style="margin-top:6px;" data-slot="metaStrip"></div>
    </div>
    <div style="border-top:1px solid var(--hairline-2);">
      <div class="transcript" style="border:0; border-radius:0; max-height:380px;" data-slot="lines"></div>
      <div data-slot="auditWrapper" hidden></div>
    </div>
  </div>
</template>

<template id="tpl-spk-bar-cell">
  <span></span>
</template>

<template id="tpl-spk-legend-entry">
  <span>
    <span class="sw"></span>
    <span data-slot="name"></span>
    <span class="pct" data-slot="pct"></span>
  </span>
</template>

<template id="tpl-merged-line">
  <div>
    <span class="ts" data-slot="ts"></span>
    <span data-slot="speakerLabel"></span>
    <span data-slot="body"></span>
  </div>
</template>

<template id="tpl-merged-seg-ok"><span data-slot="text"></span></template>

<template id="tpl-merged-seg-suppressed">
  <span class="seg suppressed" data-slot="text"></span>
</template>

<template id="tpl-merged-seg-lowconf">
  <span class="seg lowconf" data-slot="lc">
    <span data-slot="text"></span>
    <span class="conf-chip" data-slot="pct"></span>
  </span>
</template>

<template id="tpl-audit-wrapper">
  <div style="border-top:1px solid var(--hairline-2);">
    <button class="btn ghost tiny" data-toggle-audit
            style="width:100%; border:0; border-radius:0; justify-content:flex-start; padding:8px 12px; color:var(--fg-2);"
            data-slot="toggle"></button>
    <div data-slot="table"></div>
  </div>
</template>

<template id="tpl-audit-table">
  <table class="tbl audit-tbl" style="border-top:1px solid var(--hairline-2);">
    <thead><tr><th>time</th><th>speaker</th><th>text</th><th>matched rule</th><th>from</th></tr></thead>
    <tbody data-slot="rows"></tbody>
  </table>
</template>

<template id="tpl-audit-row">
  <tr>
    <td class="muted tnum" data-slot="time"></td>
    <td data-slot="speaker"></td>
    <td class="wrap"><code data-slot="text"></code></td>
    <td class="muted"><code data-slot="rule"></code></td>
    <td class="muted" data-slot="from"></td>
  </tr>
</template>
