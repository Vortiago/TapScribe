<template id="tpl-merged">
  <div class="box">
    <div class="box-hd">
      <span>merged transcript</span>
      <span class="spacer"></span>
      <span class="dim tnum tiny" data-slot="headerMeta"></span>
    </div>
    <div class="box-bd" style="padding:10px;">
      <div class="spk-bar" data-slot="spkBar" hidden></div>
      <div class="spk-legend" data-slot="spkLegend" hidden></div>
      <div class="dim tiny mt-s" data-slot="metaStrip"></div>
    </div>
    <div class="rule-top">
      <div class="transcript" style="border:0; border-radius:0; max-height:380px;" data-slot="lines"></div>
      <div data-slot="auditWrapper" hidden></div>
    </div>
  </div>
</template>

<template id="tpl-spk-bar-cell">
  <span></span>
</template>

<template id="tpl-spk-legend-entry">
  <span>
    <span class="sw"></span>
    <span data-slot="name"></span>
    <span class="pct" data-slot="pct"></span>
  </span>
</template>

<!--
  The .transcript container uses `white-space: pre-wrap` so the line
  glyphs render with real spaces and word-wrap. Every template that
  renders *inside* .transcript must therefore live on a single line —
  any indentation/newlines we'd add for readability would render as
  literal whitespace and split each segment across multiple lines.
-->
<!-- The timestamp is a BUTTON, not a span: it seeks the Player to this line's
     audio (ADR-0017). Reusing the node the line already had keeps the node count
     of this O(segments) region unchanged, and a real button is keyboard-reachable
     where a clickable span isn't. One delegated listener on the lines host does
     the work — never one per line. -->
<template id="tpl-merged-line"><div><button class="ts" type="button" data-slot="ts"></button> <span data-slot="speakerLabel"></span> <span data-slot="body"></span></div></template>

<template id="tpl-merged-seg-ok"><span data-slot="text"></span></template>

<template id="tpl-merged-seg-suppressed"><span class="seg suppressed" data-slot="text"></span></template>

<template id="tpl-merged-seg-lowconf"><span class="seg lowconf" data-slot="lc"><span data-slot="text"></span><span class="conf-chip" data-slot="pct"></span></span></template>

<template id="tpl-audit-wrapper">
  <!-- Static heading, not a button: the classic dashboard's collapse toggle
       lost its click wiring in the Stages rewrite and the list is now always
       visible, so the ▾/▸ affordance was a dead control. .audit-toggle keeps
       the flush full-width dim-text metrics. -->
  <div class="rule-top">
    <div class="tiny audit-toggle" data-slot="auditHead"></div>
    <div data-slot="table"></div>
  </div>
</template>

<template id="tpl-audit-table">
  <table class="tbl audit-tbl rule-top">
    <thead><tr><th>time</th><th>speaker</th><th>text</th><th>matched rule</th><th>from</th></tr></thead>
    <tbody data-slot="rows"></tbody>
  </table>
</template>

<template id="tpl-audit-row">
  <tr>
    <!-- The time cell seeks, exactly like a merged line's timestamp: this table
         is "the filter dropped this line" — the sharpest reason to want the
         audio. It sits inside mergedHost, so the view's ONE delegated listener
         already serves it. -->
    <td class="muted tnum"><button class="ts" type="button" data-slot="time"></button></td>
    <td data-slot="speaker"></td>
    <td class="wrap"><code data-slot="text"></code></td>
    <td class="muted"><code data-slot="rule"></code></td>
    <td class="muted" data-slot="from"></td>
  </tr>
</template>
