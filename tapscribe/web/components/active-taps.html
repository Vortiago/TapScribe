<template id="tpl-active-empty">
  <div class="empty">No taps. Speak in the bridged tab to capture.</div>
</template>

<template id="tpl-active-badge-idle">
  <span class="dim tiny">idle</span>
</template>

<template id="tpl-active-badge-capturing">
  <span class="chip rec" style="padding:1px 6px; font-size:10px;">
    <span class="dot rec x6"></span>capturing
  </span>
</template>

<template id="tpl-stream-row">
  <!--
    Wrap the row + its in-flight buffer line in one container so the
    pair lays out (and screenshots / queries) as a single unit. The
    .stream-row itself still owns the fixed-grid layout; .stream-buffer
    is positioned beneath via the wrapper's natural block flow.
  -->
 <div class="stream-row-wrap">
  <div class="stream-row">
    <span class="dot rec" title="receiving"></span>
    <div class="who">
      <div class="name">
        <span class="spk-marker" data-slot="spkMarker">●</span>
        <span class="fg" data-slot="name"></span>
      </div>
      <div class="ident" data-slot="ident"></div>
      <div class="level-meter" data-slot="meter" title="peak amplitude of incoming PCM (last ~200 ms)">
        <div class="level-fill" data-slot="meterFill"></div>
      </div>
    </div>
    <div class="tap-toggles">
      <button class="tap-toggle rec" data-toggle="record" title="Save this tap to a WAV (applies to next utterance)">rec</button>
      <button class="tap-toggle live" data-toggle="live" title="Send this tap to the live channel (applies to next utterance)">live</button>
    </div>
    <div class="stats">
      <div><span class="b" data-slot="size"></span></div>
      <div><span class="m" data-slot="dur"></span></div>
      <div><span class="lag" data-slot="lag" hidden></span></div>
    </div>
  </div>
  <!--
    In-flight hypothesis text (buffer_transcription from WlK). Shown
    as a muted italic line BELOW the row so it doesn't disrupt the
    fixed-width tap layout. Hidden when empty (live off, gate closed,
    or text just committed). Operators see what the model is currently
    transcribing before it commits to the chat log.
  -->
  <div class="stream-buffer" data-slot="bufferRow" hidden>
    <span class="dim tiny">⟳</span>
    <span class="buffer-text" data-slot="bufferText"></span>
  </div>
 </div>
</template>
