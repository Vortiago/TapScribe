<template id="tpl-active-empty">
  <div class="empty">No taps. Speak in the bridged tab to capture.</div>
</template>

<template id="tpl-active-badge-idle">
  <span class="dim tiny">idle</span>
</template>

<template id="tpl-active-badge-capturing">
  <span class="chip rec" style="padding:1px 6px; font-size:10px;">
    <span class="dot rec x6"></span>capturing
  </span>
</template>

<template id="tpl-stream-row">
  <div class="stream-row">
    <span class="dot rec" title="receiving"></span>
    <div class="who">
      <div class="name">
        <span class="spk-marker" data-slot="spkMarker">●</span>
        <span class="fg" data-slot="name"></span>
      </div>
      <div class="ident" data-slot="ident"></div>
    </div>
    <div class="tap-toggles">
      <button class="tap-toggle rec" data-toggle="record" title="Save this tap to a WAV (applies to next utterance)">rec</button>
      <button class="tap-toggle live" data-toggle="live" title="Send this tap to the live channel (applies to next utterance)">live</button>
    </div>
    <div class="stats">
      <div><span class="b" data-slot="size"></span></div>
      <div><span class="m" data-slot="dur"></span></div>
      <div><span class="lag" data-slot="lag" hidden></span></div>
    </div>
  </div>
</template>
