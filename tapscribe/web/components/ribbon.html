<template id="tpl-ribbon-status">
  <span class="dim tiny">session</span>
  <span class="fg mono" data-slot="session"></span>
  <span class="dim">·</span>
  <span class="mono tnum" data-slot="elapsed"></span>
  <span class="dim">elapsed</span>
  <span class="dim">·</span>
  <span class="fg tnum" data-slot="wavs"></span>
  <span class="dim">wavs</span>
</template>

<template id="tpl-ribbon-error">
  <span class="dim tiny" data-slot="msg"></span>
</template>

<template id="tpl-rec-pill-recording">
  <span class="dot rec" style="width:7px;height:7px"></span>RECORDING
</template>

<template id="tpl-rec-pill-paused">
  <span class="dot"></span>PAUSED
</template>
