<!-- ======================================================================
     Stages · Taps (GLOBAL · Ingress) — Phase 2.
     The global ingress stage: the connected /tap streams (REAL, from
     /api/state active[]) with level/lag/gate + rec/live toggles, the
     speech-gate LiveConfig (REAL, reuses live-channel.js → /api/live/start),
     and a clearly-tagged MOCK strip for the net-new Tap-model concepts
     (single/multi, voice→Person mapping, per-identity persistence).
     Mounted into #viewRoot by js/next/views/taps.js.
     ====================================================================== -->
<template id="tpl-next-view-taps">
  <div data-slot="head"></div>

  <!-- Taps is a scrolling control-STACK (Recording arm · connected taps + gate ·
       Tap-model), not a fill-one-panel view: the non-fill bookend panels (the
       Recording arm and the Tap-model card) would shrink under negative free
       space and clip with NO scrollbar as direct flex children of `.work__inner`.
       `.scroll-stack` owns the overflow so every card keeps its natural height and
       a short viewport scrolls the whole stack (mirrors Settings; the connected-
       taps grid is therefore a plain grid here, not a fillcol/panel--fill). -->
  <div class="scroll-stack">
    <!-- global recording arm — REAL, POST /api/recording/toggle -->
    <div class="panel">
      <div class="panel__body">
        <div class="row-between">
          <span class="ovr-lab">Recording <span class="dim">— global arm for every tap (RECORDING_ENABLED)</span></span>
          <button class="recpill" type="button" data-slot="recPill">● recording</button>
        </div>
      </div>
    </div>

    <div class="spacer"></div>

    <!-- connected taps (reuses active-taps.js) + the speech-gate LiveConfig.
         Natural-height grid inside the scroll-stack — the stack owns the scroll,
         so neither the grid (no fillcol) nor the taps panel (no panel--fill)
         scrolls its own body. -->
    <div class="grid cols-cap">
      <div class="panel panel--primary">
        <div class="panel__head">
          <div class="panel__title"><span class="ic">🛰️</span>Connected taps</div>
          <span class="panel__hint"><span data-slot="activeTapsBadge"></span> · <span class="mono dim"><span data-slot="activeCount">0</span> taps</span></span>
        </div>
        <div class="panel__body flush"><div class="taps" data-slot="activeTapsBody"></div></div>
      </div>

      <!-- ASIDE: the speech-gate LiveConfig (reuses live-channel.js) -->
      <div class="aside">
        <div class="panel panel--accent">
          <div class="panel__head">
            <div class="panel__title"><span class="ic">📡</span>Speech gate · LiveConfig</div>
            <span class="chip" data-slot="liveStateBadge">stopped</span>
          </div>
          <div class="panel__body">
            <div class="live-mlx-note dim mono" data-slot="liveMlxNote"></div>
            <div data-slot="liveChannelBody"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="spacer"></div>

    <!-- Single vs multi-person, per identity (ADR-0021). The Bridge DECLARES it
         on the wire — the tray's loopback capture is multi by construction, a
         per-participant tap is single — and the operator overrides it durably
         here, because a declaration is only ever a default: an NDI bridge (#54)
         cannot tell a room mic from a per-participant feed.

         This stage holds the control and NOT the voice list: mode is a property
         of a live source, the Voices belong to a finished recording and live on
         Transcript.

         One delegated click listener on the rows host, `renderList` for the rows
         — a per-row listener would be re-bound on every poll tick. -->
    <div class="panel">
      <div class="panel__head">
        <div class="panel__title"><span class="ic">&#129513;</span>Tap model &middot; people</div>
        <span class="panel__hint">who is on each tap</span>
      </div>
      <div class="panel__body">
        <!-- Placeholder SIBLING of the rows host, toggled in place. -->
        <div class="empty" data-slot="modeEmpty" hidden></div>
        <div class="modelist" data-slot="modeList"></div>
        <div class="dim mono ovr-note">A multi-person tap is split into Voices after the meeting &mdash; map them to People on the Transcript stage.</div>
      </div>
    </div>
  </div>
</template>
