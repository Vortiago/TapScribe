<!-- ======================================================================
     Stages · People (GLOBAL · Registry) — the canonical cross-session Person
     model (ADR-0009). ONE editable registry, derived from /api/state's
     `people` rows (one per Person, aggregated server-side from every session's
     roster + the live identities). Each row:
       · editable display name (PUT /api/people/{id} — name once, propagates
         to every session's transcript)
       · the device identity token(s) the Person owns, each detachable when
         there's more than one (POST /api/people/{id}/detach)
       · ● live / recorded source and a "N sessions" count
       · a "Merge into…" picker to fold this Person into another
         (POST /api/people/merge) — for the same human on two devices/platforms
     Selecting a session in the spine only HIGHLIGHTS the people in it; it never
     swaps the list out. Mounted into #viewRoot by js/next/views/people.js.
     ====================================================================== -->
<template id="tpl-next-view-people">
  <div data-slot="head"></div>

  <div class="panel panel--accent panel--fill">
    <div class="panel__head">
      <div class="panel__title"><span class="ic">🗂️</span>People · across all sessions</div>
      <div class="panel__hint mono" data-slot="hint"></div>
    </div>
    <div class="panel__body">
      <div class="preg" data-slot="people"></div>
    </div>
  </div>
</template>

<!-- one REAL registry row: a canonical Person aggregated across all sessions. -->
<template id="tpl-next-pregrow">
  <div class="pregrow" data-slot="row">
    <span class="av sm" data-slot="av"></span>
    <input class="pregrow__name" type="text" data-slot="name" autocomplete="off" spellcheck="false">
    <span class="tag pregrow__src" data-slot="src"></span>
    <span class="pregrow__count mono" data-slot="count"></span>
    <span class="pregrow__ids" data-slot="ids"></span>
    <select class="pregrow__merge" data-slot="merge" aria-label="Merge into another person"></select>
    <span class="pregrow__status mono dim" data-slot="status"></span>
  </div>
</template>

<!-- one device-identity token, with a detach ✕ when the Person owns >1. -->
<template id="tpl-next-idchip">
  <span class="idchip mono">
    <span class="idchip__tok" data-slot="tok"></span>
    <button class="idchip__x" type="button" data-slot="detach" title="Detach into its own person">✕</button>
  </span>
</template>
