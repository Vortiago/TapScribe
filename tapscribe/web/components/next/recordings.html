<!-- ======================================================================
     Stages · Recordings (SESSION stage 2).
     The per-session AUDIO-FILES stage: a real waveform + the real
     strip-silence knobs, and the per-WAV list (originals + indented stripped
     region clips, with the original/stripped source toggle). Transcription
     (engine + transcribe + per-WAV cache) lives in the Transcript stage now;
     Recordings is files + silence-stripping only. Mounted into #viewRoot by
     js/next/views/recordings.js, which fills every data-slot with live
     /api/state data and wires the real endpoints. No mock data here — the
     waveform is a real, server-computed downsample (the cut overlay lands in
     a later slice).
     ====================================================================== -->
<template id="tpl-next-view-recordings">
  <div data-slot="head"></div>

  <!-- HERO: the real waveform (canvas drawn from server-computed peaks) +
       REAL strip knobs/stats/job. -->
  <div class="panel panel--primary wavehero">
    <div class="wave-top">
      <span class="wave-top__name mono" data-slot="waveName">no WAV selected</span>
      <div class="wave-stats">
        <div class="wstat"><span class="wstat__v accent" data-slot="sClips">—</span><span class="wstat__k">clips</span></div>
        <div class="wstat"><span class="wstat__v good" data-slot="sSpeech">—</span><span class="wstat__k">speech_seconds</span></div>
        <div class="wstat"><span class="wstat__v" data-slot="sIn">—</span><span class="wstat__k">in_seconds</span></div>
        <div class="wstat"><span class="wstat__v" data-slot="sKept">—</span><span class="wstat__k">kept</span></div>
      </div>
    </div>

    <!-- waveform — a REAL, server-computed downsample of the selected WAV.
         js/next/components/waveform.js mounts a <canvas> + mm:ss time axis
         here and draws peaks fetched from /api/wav/{s}/{name}/peaks; the cut
         overlay draws on top of the same canvas in a later slice. -->
    <div class="wavewrap" data-slot="waveHost"></div>

    <!-- strip-silence: REAL knobs → POST /api/sessions/{session}/strip-silence -->
    <div class="knobbar">
      <div class="kfield">
        <div class="kfield__top"><span class="kfield__k">Min silence</span><span class="kfield__v" data-slot="kvMinSilence"></span></div>
        <input type="range" min="100" max="5000" step="50" data-strip-knob="min_silence_ms" data-unit="ms">
        <div class="kfield__rng"><span>100 ms</span><span>5000 ms</span></div>
      </div>
      <div class="kfield">
        <div class="kfield__top"><span class="kfield__k">Padding</span><span class="kfield__v" data-slot="kvPad"></span></div>
        <input type="range" min="0" max="2000" step="25" data-strip-knob="pad_ms" data-unit="ms">
        <div class="kfield__rng"><span>0 ms</span><span>2000 ms</span></div>
      </div>
      <div class="kfield">
        <div class="kfield__top"><span class="kfield__k">Silence floor</span><span class="kfield__v" data-slot="kvFloor"></span></div>
        <input type="range" min="-120" max="0" step="1" data-strip-knob="speech_floor_db" data-unit="dB">
        <div class="kfield__rng"><span>-120 dB</span><span>0 dB</span></div>
      </div>
      <div class="knobbar__act">
        <button class="act act--sm act--primary" type="button" data-slot="stripBtn"
                title="Strip silence from every WAV in this session">✂ strip all</button>
        <button class="act act--sm" type="button" data-slot="clearBtn">clear</button>
      </div>
    </div>

    <!-- job progress (one job per session, transcribe OR strip) -->
    <div class="jobbar" data-slot="jobBar" hidden>
      <div class="jobbar__top"><span data-slot="jobLabel">Job running</span><span class="jobbar__pct mono" data-slot="jobCount"></span></div>
      <div class="progress"><div class="progress__fill" data-slot="jobFill"></div></div>
      <div class="jobbar__wav mono" data-slot="jobWav"></div>
    </div>
  </div>

  <div class="spacer"></div>

  <!-- per-WAV list (originals + indented stripped region clips). Transcription
       moved to the Transcript stage; this is the files view only. Fills the
       reclaimed height (the #1 fix) and scrolls its own rows. -->
  <div class="panel panel--fill">
    <div class="panel__head">
      <div class="panel__title"><span class="ic">📁</span>WAVs &amp; stripped clips</div>
      <div class="panel__hint mono" data-slot="wavHint"></div>
    </div>
    <div class="panel__body flush"><div class="wavlist" data-slot="wavList"></div></div>
  </div>
</template>

<!-- isolated waveform component (canvas + mm:ss axis + a centred message
     overlay for empty / loading / error states). Cloned by createWaveform()
     in js/next/components/waveform.js, which owns all drawing. -->
<template id="tpl-next-waveform">
  <div class="wave">
    <div class="wave-canvas-wrap">
      <canvas class="wave-canvas" data-slot="canvas"></canvas>
      <div class="wave-msg" data-slot="msg" hidden></div>
      <span class="wave-cutbadge mono" data-slot="cutBadge" hidden>✂ committed cut</span>
    </div>
    <div class="wave-axis mono" data-slot="axis"></div>
    <div class="wave-legend mono" data-slot="legend" hidden>
      <span class="wave-legend__item"><i class="sw sw--kept"></i>kept</span>
      <span class="wave-legend__item"><i class="sw sw--dropped"></i>dropped</span>
      <span class="wave-legend__item"><i class="sw sw--committed"></i>committed cut</span>
      <span class="wave-legend__item"><i class="sw sw--preview"></i>preview cut</span>
      <span class="wave-legend__item"><i class="sw sw--floor"></i>speech floor</span>
    </div>
  </div>
</template>

<!-- source toggle (original / stripped) — lives in the header actions slot. -->
<template id="tpl-next-srcsw">
  <span class="srcsw">
    <button class="srcsw__opt" type="button" data-src="original">original</button>
    <button class="srcsw__opt" type="button" data-src="stripped">stripped</button>
  </span>
</template>

<!-- one WAV-list row (original) — a native <details>. The <summary> IS the
     always-visible row: the name/sub block (data-wav-select) selects the WAV
     for the waveform header (recordings.js preventDefaults the toggle on that
     click), and clicking the rest of the summary toggles the inline transcript
     open. The transcript body lives in [data-slot=expandBody] inside the
     <details>, filled lazily on first open. Each row carries
     `content-visibility: auto` (next.css .wavrow) so the browser skips
     layout/paint of off-screen rows in a huge list. -->
<template id="tpl-next-wavrow">
  <details class="wavrow" data-slot="row">
    <summary class="wavrow__summary">
      <span class="wavrow__l" data-wav-select role="button" tabindex="0">
        <span class="wavrow__n mono" data-slot="name"></span>
        <span class="wavrow__sub mono" data-slot="sub"></span>
      </span>
      <span class="wavrow__r">
        <span class="wavrow__viewing mono">🌊 viewing</span>
        <span class="wavrow__dur mono" data-slot="dur"></span>
        <span class="wavrow__tx" data-slot="txTag"></span>
        <a class="btn tiny ghost" download title="Download WAV" data-slot="download">⬇</a>
        <button class="btn tiny ghost" type="button" data-wav-delete title="Delete this WAV">🗑</button>
      </span>
    </summary>
    <div class="wavrow__body" data-slot="expandBody"></div>
  </details>
</template>

<!-- one indented stripped region clip under its parent original — same native
     <details> shape (no select/viewing badge; clicking the summary toggles the
     clip's cached transcript). -->
<template id="tpl-next-wavclip">
  <details class="wavrow is-clip" data-slot="row">
    <summary class="wavrow__summary">
      <span class="wavrow__l">
        <span class="wavrow__n mono" data-slot="name"></span>
        <span class="wavrow__sub mono" data-slot="sub"></span>
      </span>
      <span class="wavrow__r">
        <span class="wavrow__dur mono" data-slot="dur"></span>
        <span class="wavrow__tx" data-slot="txTag"></span>
        <a class="btn tiny ghost" download title="Download stripped clip" data-slot="download">⬇</a>
        <button class="btn tiny ghost" type="button" data-wav-delete title="Delete this stripped clip">🗑</button>
      </span>
    </summary>
    <div class="wavrow__body" data-slot="expandBody"></div>
  </details>
</template>

<!-- ── Per-WAV expanded transcript (inline, lazy) ─────────────────────────
     Appended as a sibling AFTER its WAV row when expanded. The meta strip +
     the .transcript lines container reuse dashboard.css's .expand-tx /
     .transcript styling (both stylesheets load on /next). The lines container
     uses `white-space: pre-wrap`, so every template rendered INSIDE it
     (tpl-next-txline) must stay on a single line — see merged-transcript.html
     for the same constraint. -->
<template id="tpl-next-txexpand">
  <div class="expand-tx" data-slot="expandHost">
    <div class="meta" data-slot="meta"></div>
    <div class="transcript" data-slot="lines"></div>
  </div>
</template>

<!-- one meta key/value chip in the expand strip -->
<template id="tpl-next-txmeta-field">
  <span><span data-slot="label"></span> <span class="fg" data-slot="value"></span></span>
</template>

<!-- one transcript line. Single-line markup (pre-wrap container). The literal
     spaces between the spans are load-bearing layout. The body span carries
     the .seg.suppressed class on suppressed lines for the strike-through. -->
<template id="tpl-next-txline"><div><span class="ts" data-slot="ts"></span> <span data-slot="speaker"></span> <span data-slot="body"></span></div></template>

<!-- tiny placeholder shown while the full transcript is being fetched lazily -->
<template id="tpl-next-txloading">
  <div class="expand-tx-loading dim small" data-slot="loadingHost">loading transcript…</div>
</template>
