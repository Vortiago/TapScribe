<!-- ======================================================================
     Stages · Summary (SESSION stage 4) — the post-transcription summarizer.
     WIRED for the Command source (#82): the operator picks a CLI template
     (e.g. `claude -p`), edits the prompt, and clicks Generate; TapScribe pipes
     the session's merged transcript to the command on stdin and renders the
     summary it prints to stdout. The Local (#86) and API (#85) sources are
     wired too — API targets an OpenAI-compatible / Ollama endpoint.
     Mounted into #viewRoot by js/next/views/summary.js.
     ====================================================================== -->
<template id="tpl-next-view-summary">
  <div data-slot="head"></div>

  <div class="grid cols-tx fillcol">
    <!-- LEFT: the generated summary OUTPUT. Fills the column height and scrolls
         its own body (consistent with the other stages). -->
    <div class="panel panel--primary panel--fill">
      <div class="panel__head">
        <div class="panel__title"><span class="ic">📄</span>Summary</div>
        <span class="panel__hint mono" data-slot="sumOutHint"></span>
      </div>
      <div class="panel__body"><div data-slot="sumOut"></div></div>
    </div>

    <!-- RIGHT: the Summarizer controls (Command source wired). -->
    <div class="aside">
      <div class="panel panel--accent">
        <div class="panel__head">
          <div class="panel__title"><span class="ic">🪄</span>Summarizer</div>
          <span class="panel__hint">one job per session</span>
        </div>
        <div class="panel__body">
          <!-- 1. source (segmented). Local (bundled, offline) is the wired
               default; Command is wired too; API lands in #85 and stays
               disabled. js/next/views/summary.js wires the clicks. -->
          <div class="field" style="margin-bottom:11px">
            <label>source</label>
            <span class="segctl segctl--wide">
              <button class="segctl__opt is-on" type="button" data-src="local" aria-pressed="true" title="bundled offline model — runs with no network">🖥️ Local</button>
              <button class="segctl__opt" type="button" data-src="api" aria-pressed="false" title="OpenAI-compatible / Ollama endpoint">🌐 API</button>
              <button class="segctl__opt" type="button" data-src="command" aria-pressed="false" title="pipe the transcript to a CLI tool">⌨️ Command</button>
            </span>
          </div>

          <!-- 2a. Local source detail: pick which bundled model to run. The
               <select> is populated ONCE from GET /api/summarize/models (the
               hardware-routed catalog — MLX on a Mac, GGUF elsewhere) and never
               rebuilt per-tick, so the interaction hold holds. Shown by default
               (Local is the default source). -->
          <div class="srcdetail" data-slot="srcLocal">
            <div class="srcdetail__lab">🖥️ Local <span class="dim">— bundled offline model · runs with no network</span></div>
            <div class="field" style="margin-top:6px">
              <label>model</label>
              <select class="sel sel--model" data-slot="sumModel" aria-label="Local summarizer model"></select>
            </div>
            <div class="dim mono" data-slot="sumModelNote" style="margin-top:4px">first Generate downloads the model, then it runs fully offline</div>
            <!-- OUTPUT length cap. The input window is the model's native one (not
                 a knob on MLX); this caps how long the summary itself can be —
                 raise it for long meetings or reasoning models. Seeded with the
                 server default + bounds from GET /api/summarize/models. -->
            <div class="field" style="margin-top:8px">
              <label>max output tokens <span class="dim">— summary length cap</span></label>
              <input class="inp-txt mono" type="number" data-slot="sumMaxTokens" min="16" max="8192" step="64" value="2048" aria-label="Max output tokens">
            </div>
          </div>

          <!-- 2b. Command source detail: the CLI template. The merged transcript
               is piped to it on stdin; the prompt is appended as a trailing
               argument (so `claude -p` becomes `claude -p "<prompt>"`). The
               preset <select> only SEEDS the editable template (rows from
               GET /api/summarize/models — convenience + hardened flags, NOT an
               allowlist); the preview spells out the resulting invocation.
               Hidden until the operator picks the Command source. -->
          <div class="srcdetail" data-slot="srcCommand" hidden>
            <div class="srcdetail__lab">⌨️ Command <span class="dim">— a CLI tool · transcript on stdin</span></div>
            <div class="field" style="margin-top:6px">
              <label>preset</label>
              <select class="sel sel--model" data-slot="sumCmdPreset" aria-label="Command preset"></select>
            </div>
            <div class="dim mono" data-slot="sumCmdPresetNote" style="margin-top:4px"></div>
            <div class="field" style="margin-top:8px"><label>command template</label><input class="inp-txt mono" type="text" data-slot="sumCmd" value='claude -p --tools "" --bare'></div>
            <div class="dim mono" data-slot="sumCmdPreview" style="margin-top:4px"></div>
          </div>

          <!-- 2c. API source detail (#85): an OpenAI-compatible chat-completions
               endpoint (Ollama's /v1, etc.). base_url + model are sent in the
               clear; the API key is WRITE-ONLY — the server never echoes it
               back (state/config expose only a key_set boolean), the field is
               never pre-filled, and a blank key on save preserves the stored
               one. Hidden until the operator picks the API source. -->
          <div class="srcdetail" data-slot="srcApi" hidden>
            <div class="srcdetail__lab">🌐 API <span class="dim">— OpenAI-compatible endpoint · chat completions</span></div>
            <div class="field" style="margin-top:6px">
              <label>base URL</label>
              <input class="inp-txt mono" type="text" data-slot="sumApiBase" placeholder="http://localhost:11434/v1" aria-label="API base URL">
            </div>
            <div class="field" style="margin-top:8px">
              <label>model</label>
              <input class="inp-txt mono" type="text" data-slot="sumApiModel" placeholder="qwen3" aria-label="API model name">
            </div>
            <div class="field" style="margin-top:8px">
              <label>API key <span class="dim">— write-only · never displayed</span></label>
              <input class="inp-txt mono" type="password" data-slot="sumApiKey" autocomplete="off" aria-label="API key">
            </div>
            <div class="dim mono" data-slot="sumApiKeyNote" style="margin-top:4px"></div>
          </div>

          <!-- 3. prompt (appended to the command argv) -->
          <div class="field" style="margin-top:11px">
            <label>prompt</label>
            <textarea class="ta" rows="3" data-slot="sumPrompt">Summarize this meeting into decisions, action items, and open questions.</textarea>
          </div>

          <!-- 3b. per-session override (#84): the controls pre-fill from the
               EFFECTIVE config (session override over global default); "save
               for this session" persists source + prompt to session-meta,
               "use global default" clears the override (empty falls back).
               Generate is unaffected — it always sends the live values. -->
          <div style="display:flex; align-items:center; gap:8px; margin-top:8px">
            <button class="act act--sm" type="button" data-slot="sumSaveSession" title="persist source + prompt as this session's override">💾 save for this session</button>
            <button class="act act--sm" type="button" data-slot="sumUseDefault" title="clear the override — this session falls back to the global default">↩ use global default</button>
            <span class="dim mono" data-slot="sumSaveStatus"></span>
          </div>
          <div class="dim mono" data-slot="sumOverrideNote" style="margin-top:4px"></div>

          <!-- 4. Generate -->
          <button class="act act--sm act--primary act--wide" type="button" data-slot="sumGenerate" style="margin-top:10px">🪄 Generate summary</button>
          <div class="dim mono ovr-note" data-slot="sumNote"></div>

          <!-- job progress (one job per session — transcribe / strip / summarize) -->
          <div class="jobbar" data-slot="jobBar" hidden>
            <div class="jobbar__top"><span data-slot="jobLabel">Summarizing</span><span class="jobbar__pct mono" data-slot="jobCount"></span></div>
            <div class="progress"><div class="progress__fill" data-slot="jobFill"></div></div>
            <div class="jobbar__wav mono" data-slot="jobWav"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
