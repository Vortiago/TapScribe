<template id="tpl-sess-empty">
  <div class="dim small" style="padding:12px;" data-slot="msg"></div>
</template>

<template id="tpl-sess-group-hd">
  <div class="sess-group-hd">
    <span data-slot="name"></span>
    <span class="dim" data-slot="count"></span>
  </div>
</template>

<template id="tpl-sess-item">
  <div class="sess-item" role="button" tabindex="0">
    <span class="indic"></span>
    <span>
      <div class="lbl-1" data-slot="primary"></div>
      <div class="lbl-2" data-slot="folder"></div>
    </span>
    <span class="row" style="gap:4px;">
      <span class="ct" data-slot="counter"></span>
      <button class="del" data-slot="del" title="Delete this session folder" hidden>×</button>
    </span>
  </div>
</template>

<template id="tpl-sess-item-unnamed">
  <span class="dim" data-slot="label"></span>
</template>
