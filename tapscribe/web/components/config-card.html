<template id="tpl-cfg-col">
  <div class="cfg-col">
    <div class="k">
      <span data-slot="title"></span>
      <span class="meta" data-slot="file"></span>
      <span class="meta" data-slot="count"></span>
    </div>
    <div class="v" data-slot="body"></div>
  </div>
</template>

<!-- Behavioural note shown above the hallucination-filter editor: the
     filter is DESTRUCTIVE — a matched segment is removed from the visible
     transcript and stashed under suppressed_hallucinations. Surfaced so an
     operator broadening a rule understands they're dropping transcript
     content, not just tagging it. -->
<template id="tpl-cfg-hal-prefix">
  <div class="dim tiny" style="margin-bottom:4px;">
    matched segments dropped &amp; stashed in <code style="display:inline;">suppressed_hallucinations</code>
  </div>
</template>

<!-- Editable textarea + save button used for prompt / live-prompt /
     hotwords editors. The component code wires the save handler to a
     PUT /api/config/<key>. `data-slot="status"` holds the save status
     badge (idle / saving / saved / failed). -->
<template id="tpl-cfg-editor">
  <textarea class="textarea cfg-editor-text" rows="3" data-slot="textarea"></textarea>
  <div class="row gap-xs cfg-editor-actions">
    <button class="btn tiny" type="button" data-slot="saveBtn">save</button>
    <span class="dim tiny" data-slot="status"></span>
    <span class="spacer" style="flex:1;"></span>
    <span class="dim tiny" data-slot="overrideCount"></span>
  </div>
</template>
