version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "python-multipart"
          - "numpy"
          - "websockets"
      python-dev:
        patterns:
          - "pytest*"
          - "httpx"
          - "ruff"
          - "playwright"
          - "soundfile"
          - "scipy"
          - "sounddevice"
      python-ml:
        patterns:
          - "faster-whisper"
          - "whisperlivekit"
          - "mlx-whisper"
          - "transformers"
          - "torch"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "npm"
    # Dev-only typecheck/e2e manifests; the bridge itself ships no npm deps.
    directories:
      - "/frontend"
      - "/bridges/spacialchat-bridge/e2e"
      - "/bridges/spacialchat-bridge/typecheck"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"
