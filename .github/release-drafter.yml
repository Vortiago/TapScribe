name-template: "$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
template: |
  ## What's changed

  $CHANGES

  **Full changelog:** https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: "Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "Fixes"
    labels:
      - "fix"
      - "bug"
  - title: "Dependencies"
    labels:
      - "deps"
      - "dependencies"
  - title: "Internal"
    labels:
      - "internal"
      - "refactor"
      - "ci"
      - "docs"
      - "test"
      - "chore"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

# Bump rules: a PR labelled `major` (or `breaking`) bumps the major segment;
# `minor` bumps the minor segment; everything else is a patch.
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bug"
      - "deps"
      - "internal"
      - "refactor"
      - "ci"
      - "docs"
      - "test"
      - "chore"
  default: patch

exclude-labels:
  - "skip-changelog"

autolabeler:
  - label: "deps"
    title:
      - '/^deps(\(.*\))?:/i'
      - '/^build(\(.*\))?:/i'
  - label: "ci"
    title:
      - '/^ci(\(.*\))?:/i'
  - label: "fix"
    title:
      - '/^fix(\(.*\))?:/i'
  - label: "feature"
    title:
      - '/^feat(\(.*\))?:/i'
  - label: "docs"
    title:
      - '/^docs(\(.*\))?:/i'
  - label: "test"
    title:
      - '/^test(\(.*\))?:/i'
  - label: "refactor"
    title:
      - '/^refactor(\(.*\))?:/i'
