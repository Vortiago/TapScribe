  #   runs-on: ubuntu-latest
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/p/tapscribe
  #   permissions:
  #     id-token: write
  #   steps:
  #     - name: Download dist artifact
  #       uses: actions/download-artifact@v8
  #       with:
  #         name: dist
  #         path: dist/
