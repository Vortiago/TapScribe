name: Release

# Tag-driven release: pushing a `v*` tag (e.g. `v0.2.0`) builds the wheel
# + sdist, creates a GitHub release with auto-generated notes from
# release-drafter, and (once Trusted Publishing is set up) publishes to PyPI.
#
# Manual dispatch is also allowed for re-runs from the Actions tab when a
# tag push didn't trigger (e.g. ring-signed tags from an integration).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Required for PyPI Trusted Publishing OIDC token; harmless when the
  # publish step is disabled.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The interpreter the Windows Bundle embeds (ADR-0015). Pinned so a Bundle is
  # reproducible and an upstream retag can't silently change what operators
  # install. python-build-standalone tags are dates; verify the asset name still
  # exists before bumping — the CPython patch level is part of it.
  PBS_TAG: "20260718"
  PBS_PYTHON: "3.12.13"

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Read version from tag
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "Building TapScribe ${ref#v}"

      - name: Build distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  extension:
    name: package spacialchat extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Package the extension
        run: python tools/package_bridge.py spacialchat --out dist-bridge

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: bridge-extension
          path: dist-bridge/tapscribe-spacialchat-bridge.zip
          if-no-files-found: error

  tray:
    name: publish windows tray bridge
    # WinForms `net10.0-windows` self-contained publish is unreliable
    # cross-OS, so this MUST run on windows-latest (matching ci.yml's
    # `dotnet-build` job).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: bridges/windows-tray-bridge/global.json

      - name: Derive version from tag
        shell: bash
        run: echo "VER=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: >
          dotnet publish bridges/windows-tray-bridge/src/TapScribe.TrayBridge
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VER }}
          -p:InformationalVersion=${{ env.VER }}

      - name: Zip the published exe
        shell: pwsh
        run: >
          Compress-Archive
          -Path "bridges/windows-tray-bridge/src/TapScribe.TrayBridge/bin/Release/net10.0-windows/win-x64/publish/TapScribe.TrayBridge.exe"
          -DestinationPath "TapScribe.TrayBridge-win-x64.zip" -Force

      - name: Upload tray artifact
        uses: actions/upload-artifact@v7
        with:
          name: bridge-tray
          path: TapScribe.TrayBridge-win-x64.zip
          if-no-files-found: error

  # Docker→GHCR is deliberately NOT a `needs` of `github-release`: a GHCR
  # hiccup must not hold back the Release (notes + wheel + sdist + both
  # bridge zips). This job runs in parallel and publishes the image
  # independently; a failure here leaves a complete GitHub Release intact.
  docker:
    name: build + push docker image (ghcr)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        run: echo "VER=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Owner is lowercased (`Vortiago` -> `vortiago`) — GHCR requires
          # a lowercase repository path.
          tags: |
            ghcr.io/vortiago/tapscribe:v${{ env.VER }}
            ghcr.io/vortiago/tapscribe:latest

  bundle:
    name: build windows bundle
    # Must be windows-latest: it lays down a Windows embedded CPython, pip-installs
    # into it (torch ships OS-specific wheels), publishes a WinForms Launcher, and
    # runs Inno Setup — none of which cross-compile.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: packaging/windows/global.json

      - name: Derive version from tag
        shell: bash
        run: echo "VER=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      # The SAME wheel PyPI gets. The Bundle installs this rather than resolving
      # `tapscribe` from PyPI, so the shipped installer's version can never drift
      # from the server it starts (ADR-0015).
      - name: Download the wheel built upstream
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Fetch the embedded CPython (python-build-standalone)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # A standalone, relocatable CPython — NOT the python.org embeddable zip,
          # which ships no pip and no venv module and so can't run /setup's
          # runtime install at all.
          $tag = "${{ env.PBS_TAG }}"
          $asset = "cpython-${{ env.PBS_PYTHON }}+$tag-x86_64-pc-windows-msvc-install_only.tar.gz"
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$tag/$asset"
          Write-Host "Fetching $url"
          Invoke-WebRequest -Uri $url -OutFile pbs.tar.gz
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          tar -xzf pbs.tar.gz -C staging
          # The archive unpacks to staging/python/…. Assert BOTH interpreters:
          # the Launcher spawns the Recorder with pythonw.exe (no console
          # window) and runs preflight with python.exe, and BundleLayout hard-
          # codes those paths. An upstream layout change has to fail here, not
          # as a silent "nothing happens when I click the tray icon".
          foreach ($exe in @("python.exe", "pythonw.exe")) {
            if (-not (Test-Path "staging/python/$exe")) {
              throw "python-build-standalone layout changed — expected staging/python/$exe"
            }
          }

      - name: Install TapScribe's core deps into the embedded interpreter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $py = "staging/python/python.exe"
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          & $py -m pip install --upgrade pip
          # Core deps only. Model backends are chosen by the operator at /setup
          # and pip-installed then — bundling every family would multiply an
          # already multi-GB payload for extras most operators don't want.
          & $py -m pip install "$wheel"
          if ($LASTEXITCODE -ne 0) { throw "core dependency install failed" }
          New-Item -ItemType Directory -Force -Path staging/wheel | Out-Null
          Copy-Item $wheel staging/wheel/

      - name: Publish the Launcher
        shell: pwsh
        run: >
          dotnet publish packaging/windows/src/TapScribe.Bundle.Launcher
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VER }}
          -p:InformationalVersion=${{ env.VER }}
          -o staging/launcher

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Inno Setup ships preinstalled on windows-latest runners.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc /DMyAppVersion=${{ env.VER }} packaging/windows/TapScribe.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          # Stable, UNVERSIONED filename so releases/latest/download/<name>
          # stays a permanent URL across versions (ADR-0012).
          path: dist-bundle/TapScribe-Setup-win-x64.exe
          if-no-files-found: error

  github-release:
    name: github release
    needs: [build, extension, tray, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: bridge-extension
          path: bridge-artifacts/

      - name: Download tray artifact
        uses: actions/download-artifact@v8
        with:
          name: bridge-tray
          path: bridge-artifacts/

      # NOT under bridge-artifacts/: a Bundle is not a Bridge (CONTEXT.md). It
      # is the Recorder packaged, so it never appears in the dashboard's
      # "Get a bridge" card — you need a Bundle to have a dashboard.
      - name: Download windows bundle
        uses: actions/download-artifact@v8
        with:
          name: windows-bundle
          path: bundle-artifacts/

      - name: Draft release notes (release-drafter)
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach distributions to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*
            bridge-artifacts/tapscribe-spacialchat-bridge.zip
            bridge-artifacts/TapScribe.TrayBridge-win-x64.zip
            bundle-artifacts/TapScribe-Setup-win-x64.exe
          fail_on_unmatched_files: true

  # PyPI Trusted Publishing. The publisher is registered on PyPI against THIS
  # workflow filename (`release.yml`) + the `pypi` environment below — changing
  # either breaks the OIDC exchange, so they are a contract with pypi.org, not
  # free-form names. No token-based fallback: Trusted Publishing or nothing.
  #
  # `needs: [build]` ONLY, deliberately. The Windows Bundle job runs on a
  # different OS with a much longer toolchain (embedded interpreter, torch,
  # Inno Setup); a failure there must not block or corrupt a PyPI upload that
  # is already fully determined by the wheel `build` produced.
  pypi-publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tapscribe
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
