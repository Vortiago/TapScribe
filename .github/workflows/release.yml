name: Release

# Tag-driven release: pushing a `v*` tag (e.g. `v0.2.0`) builds the wheel
# + sdist, creates a GitHub release with auto-generated notes from
# release-drafter, and (once Trusted Publishing is set up) publishes to PyPI.
#
# Manual dispatch is also allowed for re-runs from the Actions tab when a
# tag push didn't trigger (e.g. ring-signed tags from an integration).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Required for PyPI Trusted Publishing OIDC token; harmless when the
  # publish step is disabled.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Read version from tag
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "Building TapScribe ${ref#v}"

      - name: Build distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  extension:
    name: package spacialchat extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Package the extension
        run: python tools/package_bridge.py spacialchat --out dist-bridge

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: bridge-extension
          path: dist-bridge/tapscribe-spacialchat-bridge.zip
          if-no-files-found: error

  tray:
    name: publish windows tray bridge
    # WinForms `net10.0-windows` self-contained publish is unreliable
    # cross-OS, so this MUST run on windows-latest (matching ci.yml's
    # `dotnet-build` job).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: bridges/windows-tray-bridge/global.json

      - name: Derive version from tag
        shell: bash
        run: echo "VER=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: >
          dotnet publish bridges/windows-tray-bridge/src/TapScribe.TrayBridge
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VER }}
          -p:InformationalVersion=${{ env.VER }}

      - name: Zip the published exe
        shell: pwsh
        run: >
          Compress-Archive
          -Path "bridges/windows-tray-bridge/src/TapScribe.TrayBridge/bin/Release/net10.0-windows/win-x64/publish/TapScribe.TrayBridge.exe"
          -DestinationPath "TapScribe.TrayBridge-win-x64.zip" -Force

      - name: Upload tray artifact
        uses: actions/upload-artifact@v7
        with:
          name: bridge-tray
          path: TapScribe.TrayBridge-win-x64.zip
          if-no-files-found: error

  # Docker→GHCR is deliberately NOT a `needs` of `github-release`: a GHCR
  # hiccup must not hold back the Release (notes + wheel + sdist + both
  # bridge zips). This job runs in parallel and publishes the image
  # independently; a failure here leaves a complete GitHub Release intact.
  docker:
    name: build + push docker image (ghcr)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        run: echo "VER=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Owner is lowercased (`Vortiago` -> `vortiago`) — GHCR requires
          # a lowercase repository path.
          tags: |
            ghcr.io/vortiago/tapscribe:v${{ env.VER }}
            ghcr.io/vortiago/tapscribe:latest

  github-release:
    name: github release
    needs: [build, extension, tray]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: bridge-extension
          path: bridge-artifacts/

      - name: Download tray artifact
        uses: actions/download-artifact@v8
        with:
          name: bridge-tray
          path: bridge-artifacts/

      - name: Draft release notes (release-drafter)
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach distributions to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*
            bridge-artifacts/tapscribe-spacialchat-bridge.zip
            bridge-artifacts/TapScribe.TrayBridge-win-x64.zip
          fail_on_unmatched_files: true

  # TODO(havso): enable PyPI Trusted Publishing once the `tapscribe` project
  # is claimed on PyPI. Configure the trusted-publisher there with this
  # workflow file + environment name, then uncomment the job below. We
  # intentionally do NOT add a token-based fallback — Trusted Publishing or
  # nothing, per the team-lead decision.
