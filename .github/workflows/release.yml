  # pypi-publish:
  #   name: publish to PyPI (trusted publishing)
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/p/tapscribe
  #   permissions:
  #     id-token: write
  #   steps:
  #     - name: Download dist artifact
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: dist
  #         path: dist/
