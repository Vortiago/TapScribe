name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          # We only install the lightweight dependencies needed to run the
          # unit tests — no torch / faster-whisper / mlx-whisper. The tests
          # are scoped to pure helpers that don't need a real model loaded.
          pip install fastapi uvicorn python-multipart numpy pytest pytest-asyncio pytest-cov httpx ruff

      - name: Lint (ruff)
        run: ruff check tapscribe tools tests

      - name: Run tests
        run: pytest tests -q --cov=tapscribe --cov-report=term-missing
