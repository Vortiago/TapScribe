name: CI

on:
  push:
    # Run on main (post-merge) and on any feature branch — including the
    # `claude/**` branches the Claude-Code integration pushes — so the
    # underlying push event triggers CI even when the PR was opened by a
    # bot whose pull_request events don't trigger workflows.
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [main]
  # Allow the operator to manually re-run from the Actions tab — useful
  # when a PR was opened by an integration whose token doesn't trigger
  # the pull_request event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          # `pip install -e .` rather than a hand-maintained list: the CORE
          # dependencies are already the lightweight ones (fastapi, uvicorn,
          # python-multipart, numpy, websockets, cryptography, onnxruntime) and
          # every heavy backend — torch, faster-whisper, mlx-whisper — is an
          # optional extra, so this stays as light as the old list while being
          # unable to drift from it.
          #
          # It used to be hand-maintained, and it DID drift: `onnxruntime` was
          # missing for a while after #374 made it core, which silently skipped
          # every test exercising the VAD (the gate tests, the strip-silence
          # detector) on all nine legs. Resolving pyproject also means the
          # version bounds declared there — notably the `fastapi<0.140` cap that
          # the route-surface sweeps depend on (see tests/route_inventory.py) —
          # actually bind in the job that runs those tests.
          #
          # `cryptography` arrives as a core dep, so test_tls runs rather than
          # silently importorskip-ing past the --tls boot path.
          pip install -e . pytest pytest-asyncio pytest-cov httpx hypothesis ruff

      - name: Lint (ruff)
        run: ruff check tapscribe tools tests benchmarks bridges/local-test-bridge

      - name: Format check (ruff)
        # Fail the push if any tracked Python is unformatted — same scope as the
        # lint step above (and as the local stop.sh gate), so `ruff format`
        # drift can't slip in unnoticed. Fix with `ruff format tapscribe tools
        # tests benchmarks bridges/local-test-bridge`.
        run: ruff format --check tapscribe tools tests benchmarks bridges/local-test-bridge

      - name: Run tests
        run: pytest tests -q --cov=tapscribe --cov-report=term-missing

  # The bridge is plain JS with no Python dependency, so it runs in its
  # own job — decoupled from the pytest matrix so a Python flake doesn't
  # hide a real bridge regression (and vice versa). Node 22 only: the
  # bridge ships as a Chrome extension (V8, not Node), so this job is
  # purely test infra and there's no reason to support older Node.
  bridge-js:
    name: bridge JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run bridge tests (Node built-in runner, no deps)
        run: node --test "bridges/spacialchat-bridge/tests/*.test.js"

  # The dashboard's browser JS (tapscribe/web/js/) is ES modules with no
  # Python dependency — same rationale as bridge-js: its own job so a
  # frontend-logic regression surfaces as its own red check. The pure
  # coalescing helpers in live-feed.js import cleanly in Node without a DOM;
  # the DOM rendering itself stays covered by the playwright dashboard e2e.
  dashboard-js:
    name: dashboard JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run dashboard JS tests (Node built-in runner, no deps)
        run: node --test "tapscribe/web/js/**/*.test.js"

  # Frontend typecheck — runs `tsc --noEmit --checkJs` against
  # tapscribe/web/js/. Files opt in via `// @ts-check`, so this job is
  # incremental: it only checks files that have explicitly enabled it.
  # Standalone job (not bolted onto bridge-js) so a type regression shows
  # up as its own red check on the PR.
  frontend-typecheck:
    name: frontend typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install TypeScript
        run: cd frontend && npm install --no-audit --no-fund

      - name: Typecheck
        run: cd frontend && npm run typecheck

  # Frontend convention gates — the vendored vanilla-web checkers
  # (tapscribe/web/tools/, provenance-stamped; re-copy from the toolkit to
  # update, never edit in place): check-conventions (signal-listener /
  # html-string / raw-swap), check-slots (the .html <template>/[data-slot] ↔
  # JS tpl()/slot()/pick() seam) and check-css-vars (a required var(--x)
  # whose name is defined nowhere). Zero-dep; each tool scans the directory
  # holding tools/ — tapscribe/web/. check-vendored.mjs (drift against the
  # toolkit) needs a Verktoykasse checkout, so it stays a local run — see
  # CLAUDE.md.
  frontend-gates:
    name: frontend gates (conventions · slots · css-vars)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: check-conventions
        run: node tapscribe/web/tools/check-conventions.mjs

      - name: check-slots
        run: node tapscribe/web/tools/check-slots.mjs

      - name: check-css-vars
        run: node tapscribe/web/tools/check-css-vars.mjs

  # Bridge typecheck — the SpatialChat Bridge's shared, dependency-free
  # helpers (control-client.js + pipeline-view.js) opt into `// @ts-check`
  # and are gated by `tsc --noEmit --strict`. Same rationale + shape as
  # frontend-typecheck, but its own package (bridges/.../typecheck/) so the
  # extension's chrome/global idioms stay out of the dashboard's tsconfig.
  # Incremental: popup.js / content.js join the gate as they're typed.
  bridge-typecheck:
    name: bridge typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bridges/spacialchat-bridge/typecheck/package.json

      - name: Install TypeScript
        run: cd bridges/spacialchat-bridge/typecheck && npm install --no-audit --no-fund

      - name: Typecheck
        run: cd bridges/spacialchat-bridge/typecheck && npm run typecheck

  # Bridge popup E2E — drives the real popup.html in Chromium (served
  # statically, chrome.* shimmed, the recorder stubbed). Verifies the
  # rendering the node tests can't reach: the ES-module graph loads, the
  # vendored vanilla-components fetch + render, and each meeting-card state is
  # shown correctly. Its own job, like the dashboard playwright E2E.
  bridge-e2e:
    name: bridge popup E2E (playwright)
    runs-on: ubuntu-latest
    # Chromium's download can WEDGE rather than fail, and it does so without
    # GitHub reporting anything wrong. Unbounded, a browser job then holds a
    # runner for the 6 hour default while the PR reads as 'still running', which
    # is indistinguishable from slow. The slowest of the three has run 5 to 9
    # minutes, and its span is mostly downloads (Chromium, then the ASR models),
    # so the bound is set well clear of a slow network rather than snugly: a
    # timeout that can fire on a bad day teaches people to re-run it, which is
    # the habit that lets a real wedge through.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bridges/spacialchat-bridge/e2e/package.json

      - name: Install deps
        run: cd bridges/spacialchat-bridge/e2e && npm install --no-audit --no-fund

      - name: Install Chromium
        run: cd bridges/spacialchat-bridge/e2e && npx playwright install --with-deps chromium

      - name: Run popup E2E
        run: cd bridges/spacialchat-bridge/e2e && npm test

  # Bridge browser E2E (headed, under xvfb) — the bridge MV3 extension loaded
  # in a real headed Chromium. MV3 extensions don't load headless, so both
  # flavours need a display (xvfb) and share one job:
  #   * extension E2E: the extension taps a fake /tap server (no real ASR);
  #   * meeting E2E: the FULL dashboard-free flow with no mocked seams — the
  #     extension taps real audio over /tap to a real Recorder, Start/End
  #     meeting from the real popup fires the real end-of-meeting pipeline
  #     (strip[silero] → transcribe[faster-whisper] → summarize[command]), and
  #     the popup card shows the real summary.
  # Heavy (CPU torch + a real transcribe for the meeting flow) so it's its own
  # job. The extension flavour ran in no CI job before; both run here now.
  bridge-meeting-e2e:
    name: bridge E2E (extension + meeting)
    runs-on: ubuntu-latest
    # Bounded against a wedged Chromium download, as bridge-e2e above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime + test harness + faster-whisper
        run: |
          # CPU torch/torchaudio FIRST so pip never downloads the default CUDA build.
          # NOTE: since #374 nothing in THIS job declares torch — silero-vad is
          # gone and whisper-cpu resolves to faster-whisper (CTranslate2, no
          # torch). These lines are kept only because dropping them is a
          # separate change that wants its own green run; if you are here to
          # trim CI time, verify no transitive consumer and delete them.
          # (~7 GB installed with its nvidia libs). The old order installed
          # CUDA torch and then --force-reinstall'd the CPU build on top,
          # leaving the runner with ~1 GB free disk — the real-audio test's
          # 1.6 GB model download then failed mid-test ("Internal Server
          # Error"), and the disk-starved runner made unrelated browser
          # tests flake at random. --no-cache-dir keeps the wheels out of
          # pip's cache for the same reason.
          pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # httpx is the real-audio pipeline E2E's HTTP client (websockets is a
          # core dep already); the rest of that test reads the committed WAV
          # fixtures via stdlib wave, so no soundfile/scipy needed at runtime.
          pip install --no-cache-dir -e ".[whisper-cpu]" playwright pytest pytest-asyncio httpx

      - name: Install Chromium + xvfb
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Pre-fetch the ASR models (keep downloads out of the tests' budget)
        run: |
          python -c "from faster_whisper import WhisperModel; WhisperModel('tiny.en', device='cpu', compute_type='int8'); WhisperModel('base', device='cpu', compute_type='int8')"
          python -c "from tapscribe.nb_whisper import download_nb_whisper_ct2_dir as d; d('nb-whisper-tiny')"
          # test_da_no_routing_benchmark transcribes with large-v3-turbo
          # (1.6 GB). Fetching it here means a download problem fails this
          # clearly-labelled step instead of surfacing as an opaque 500 from
          # the recorder mid-test.
          python -c "from faster_whisper import WhisperModel; WhisperModel('large-v3-turbo', device='cpu', compute_type='int8')"
          df -h / | tail -1

      - name: Run bridge extension E2E (headed, under xvfb)
        run: xvfb-run -a pytest tests/e2e/test_bridge_extension_e2e.py -m browser_e2e -q

      - name: Run bridge meeting E2E (headed, under xvfb)
        run: xvfb-run -a pytest tests/e2e/test_bridge_meeting_e2e.py -m browser_e2e -q

      # This job is the ONLY place an ASR package (faster-whisper) is installed
      # AND the models it needs are pre-fetched, so it is where the transcription
      # safety net actually runs. Elsewhere these self-skip (no backend), so a
      # real transcription-path regression would ship green. Not a browser test →
      # no xvfb. The transformers/MLX real_audio cases self-skip here (deps
      # absent); the transformers-family and moonshine contract smokes are
      # gated in the `upstream-contract` matrix job below instead (its
      # moonshine-mlx lane runs on a macos-arm64 runner).
      - name: Run real-audio transcription pipeline E2E (faster-whisper + NB-Whisper)
        # Includes the /tap live-gate real-audio E2E (#248): real Silero VAD
        # off the event loop → real relay → real faster-whisper over the gated
        # bytes. Both use `tiny.en`/`base`, pre-fetched above.
        run: pytest tests/e2e/test_pipeline_e2e.py tests/test_tap_live_gate_real_audio.py -m real_audio -q

      - name: Run the faster-whisper upstream-contract smoke (real package)
        run: pytest tests/test_transcribers_faster_whisper.py -k upstream_contract -q

  # Runs the importorskip-gated upstream-contract smoke tests for the
  # transformers-family adapters (Parakeet TDT + Voxtral) with the real
  # `transformers` package installed, so an upstream rename (e.g.
  # `AutoModelForTDT` / `ParakeetProcessor.decode(durations=...)` or
  # `VoxtralProcessor.apply_transcription_request` signature drift) fails
  # CI on the pin-bump PR instead of shipping silently skipped everywhere
  # — see CLAUDE.md "Upstream adapter symbols".
  # One matrix lane per real-runtime family so each contract regression
  # surfaces as its own red check (same rationale as bridge-js /
  # frontend-typecheck) without duplicating the job skeleton per lane.
  # The moonshine lanes exist because the importorskip'd smokes would
  # otherwise skip on every runner and an upstream rename would ship
  # silently (PRD #120 story 18); they run their WHOLE adapter file —
  # the stub tests are seconds, and running them with the real package
  # importable is the only automated real-runtime pass. The moonshine-mlx
  # lane runs on macos-latest (arm64/Apple Silicon — mlx installs and
  # imports only there); the other MLX smokes (mlx-whisper, parakeet-mlx,
  # mlx-lm) remain lane-less for now and self-skip everywhere.
  upstream-contract:
    name: upstream-contract smoke (${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: transformers
            os: ubuntu-latest
            extras: parakeet-cpu,voxtral-cpu
            probe: transformers
            tests: tests/test_transcribers_parakeet.py tests/test_transcribers_voxtral.py -k upstream
          - lane: moonshine-onnx
            os: ubuntu-latest
            extras: moonshine-cpu
            probe: moonshine_onnx
            tests: tests/test_transcribers_onnx_moonshine.py
          - lane: moonshine-mlx
            os: macos-latest
            extras: moonshine-mlx
            probe: mlx_audio
            tests: tests/test_transcribers_mlx_moonshine.py
          # tests/test_vad_silero_port.py is the ONLY thing pinning
          # tapscribe/vad/ — a hand port of upstream silero-vad's OnnxWrapper /
          # VADIterator / get_speech_timestamps onto numpy — against the real
          # package (#374). It importorskips silero_vad + torch, which nothing
          # else in CI installs, so before this lane it skipped on every leg and
          # the port's "line for line" claim was unverified anywhere. Those are
          # deliberately NOT project extras (dropping them is the whole point of
          # #374), so this lane installs them as test-only pins.
          - lane: silero-port
            os: ubuntu-latest
            extras: ""
            # CPU torch first, from the PyTorch index, so silero-vad's own
            # torch requirement doesn't pull the default CUDA build (~7 GB).
            pre_install: >-
              pip install --no-cache-dir torch torchaudio
              --index-url https://download.pytorch.org/whl/cpu
              && pip install --no-cache-dir silero-vad
            probe: silero_vad
            tests: tests/test_vad_silero_port.py
          # The only lane where diarization runs for real. Two things are
          # otherwise unpinned: the committed reference.npz that
          # tapscribe/diarizers/fbank.py is checked against everywhere else
          # (kaldi-native-fbank is deliberately NOT a project dependency — no
          # cp314 Windows wheel, and the shipped code is a numpy port), and every
          # test that needs the embedding MODEL, which is fetched rather than
          # vendored. The fetch below is the shipped one, so this lane exercises
          # the bring-up path too; the assert is what stops a failed fetch from
          # leaving the model-gated tests silently skipped and the lane green.
          - lane: diarize
            os: ubuntu-latest
            extras: ""
            pre_install: >-
              pip install --no-cache-dir kaldi-native-fbank
              && python -m tapscribe.diarizers.model
              && python -c "from tapscribe.diarizers import model; assert model.model_present()"
            probe: kaldi_native_fbank
            tests: tests/test_diarize_fbank_upstream.py tests/test_diarize_engine.py
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the ${{ matrix.lane }} runtime deps
        run: |
          python -m pip install --upgrade pip
          # `extras: ""` means the lane's runtime is NOT a project extra (the
          # silero-port lane pins upstream silero-vad, which #374 deliberately
          # removed from the dependency set) — install the base package and let
          # pre_install add it. `pip install -e ".[]"` is not valid.
          if [ -n "${{ matrix.extras }}" ]; then
            pip install -e ".[${{ matrix.extras }}]" pytest pytest-asyncio
          else
            pip install -e . pytest pytest-asyncio
          fi
          # `|| 'true'` is load-bearing: a lane WITHOUT pre_install renders the
          # expression to an empty string, and an `if ...; then <empty>; fi` is a
          # bash SYNTAX error — which kills the step before it runs anything, so
          # every lane that omitted the key went red at once. No conditional, no
          # empty body.
          ${{ matrix.pre_install || 'true' }}

      # The smokes are importorskip-gated, so an unimportable runtime would
      # otherwise skip them and leave the lane GREEN — the exact silent-skip
      # this job exists to close. Probe the import so that fails RED.
      - name: Verify the ${{ matrix.lane }} runtime actually imports
        run: python -c "import ${{ matrix.probe }}"

      - name: Run the ${{ matrix.lane }} upstream-contract smoke tests
        run: pytest ${{ matrix.tests }} -q

  # The tray Bridge (bridges/tray-bridge/) is a .NET solution: a cross-platform
  # bridge-core class library, one platform layer per OS (WASAPI on Windows,
  # Core Audio on macOS) and one tray shell each. Standalone job, same rationale
  # as bridge-js / frontend-typecheck: a C# regression surfaces as its own red
  # check.
  #
  # Each OS names its own projects rather than the .slnx: a net10.0-macos target
  # needs Xcode, which this runner has not got, and a net10.0-windows one needs
  # Windows. The .slnx is the union view for an editor; the macos job covers the
  # app-bundle projects and the ubuntu job the two net10.0 ones.
  #
  # One project per step, deliberately: a pwsh `run:` block reports only the
  # LAST command's exit code, so several `dotnet test` calls batched into one
  # step would go green on a failure in any but the last.
  dotnet-build:
    name: dotnet build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: bridges/tray-bridge/global.json

      # dotnet-core-crossplatform runs these on ubuntu for the portability
      # invariant. Running them HERE is a different guarantee: Core holds the
      # meeting and pipeline logic both shells drive, so this is where a Windows
      # regression in it is caught.
      - name: Test bridge-core
        run: dotnet test bridges/tray-bridge/tests/TapScribe.Bridge.Core.Tests/TapScribe.Bridge.Core.Tests.csproj -c Release

      - name: Test the Windows platform layer
        run: dotnet test bridges/tray-bridge/tests/TapScribe.Bridge.Windows.Tests/TapScribe.Bridge.Windows.Tests.csproj -c Release

      - name: Test the Windows tray shell
        run: dotnet test bridges/tray-bridge/tests/TapScribe.TrayBridge.Windows.Tests/TapScribe.TrayBridge.Windows.Tests.csproj -c Release

      # The macOS job proves its .pkg installs and that the installed app launches. This
      # is that gate for Windows, and on the same thing an operator downloads: the
      # single-file self-contained exe. A build says the code compiles; a tray that dies
      # on its first WinForms call is a green CI and a broken release.
      #
      # This publish also IS the build gate for the shell, which is why no plain build
      # step precedes it: if the launch half is ever deleted (see below), leave a
      # `dotnet build` of TapScribe.TrayBridge.Windows.csproj behind.
      #
      # The publish flags are release.yml's, minus the -p:Version it stamps from the tag.
      # Copied out of its build tree rather than zipped: the property under test is that
      # the exe runs on its own, and release.yml owns the zipping. A fresh APPDATA so the
      # FIRST launch is what runs; nothing reaches a Recorder until Start meeting.
      #
      # If this ever fails for a reason that is about the runner rather than the code (a
      # NotifyIcon in a session with no desktop, say), delete it. A launch gate that has
      # to be retried is worse than none.
      - name: Prove the published exe launches
        timeout-minutes: 5
        run: |
          dotnet publish bridges/tray-bridge/src/TapScribe.TrayBridge.Windows `
            -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          # Checked here, because a native command's exit code does not stop a pwsh block: a
          # failed publish would otherwise run on and surface as Copy-Item complaining about a
          # missing path, which reads as a drifted path rather than as code that will not build.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = "bridges/tray-bridge/src/TapScribe.TrayBridge.Windows/bin/Release/net10.0-windows/win-x64/publish/TapScribe.TrayBridge.exe"
          $alone = (New-Item -Force -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "tray-launch")).FullName
          Copy-Item $published $alone
          $env:APPDATA = (New-Item -Force -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "tray-appdata")).FullName
          $tray = Start-Process -PassThru -FilePath (Join-Path $alone "TapScribe.TrayBridge.exe")
          # Ten seconds is the ceiling, not the wait: a crash on launch returns here at
          # once, and the grace period only has to clear the tray icon, the menu and the
          # first settings load.
          if ($tray.WaitForExit(10000)) {
            Write-Host "FAIL: the exe exited $($tray.ExitCode) within 10s of launching."
            exit 1
          }
          Stop-Process -Id $tray.Id -Force
          Write-Host "OK: the published exe launched and stayed up."

  # The compile gate for the two net10.0-macos projects, the shell and its tests
  # (ADR-0020): an app bundle needs Xcode and the macos workload, neither of
  # which the windows or ubuntu runners have, so a break in it is invisible
  # without this job. The workload is not on the runner image by default.
  #
  # The Mac PLATFORM LAYER is net10.0 and deliberately not confined here: it
  # runs on ubuntu too, and again here, where the tests that ask the running OS
  # a question stop skipping.
  dotnet-build-macos:
    name: dotnet build + test (macos)
    runs-on: macos-latest
    # The one job that talks to a real login Keychain. A Keychain call that needs
    # to prompt and cannot BLOCKS rather than failing, so without a bound this job
    # would sit on the priciest runner class for GitHub's 6 hour default before
    # anyone learned anything. Ten minutes is several times the honest runtime
    # (workload install included), so hitting this is a diagnosis, not a flake.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: bridges/tray-bridge/global.json

      # Core owns the settings / state / history stores, and ADR-0020 puts Mac
      # state under ~/Library/Application Support/TapScribe/, so a path or
      # filesystem regression that only shows on macOS is caught here. Needs no
      # workload, hence ahead of the install.
      - name: Test bridge-core
        run: dotnet test bridges/tray-bridge/tests/TapScribe.Bridge.Core.Tests/TapScribe.Bridge.Core.Tests.csproj -c Release

      - name: Install the macos workload
        run: dotnet workload install macos

      # A dedicated keychain for the [RequiresMacOS] Keychain round trip, because
      # the runner's login keychain is the wrong thing to bet on twice over: if it
      # is locked, SecItemAdd answers errSecInteractionNotAllowed and the test
      # fails for a reason that is about the runner rather than the code, and if
      # something wants to prompt, the call BLOCKS instead of failing and the job
      # burns its budget saying nothing. Created unlocked, with -lut so it cannot
      # re-lock underneath a slow step, and made the default so SecItemAdd lands
      # in it. The password is a throwaway for a keychain that exists for the
      # length of one job and holds one test token; it protects nothing.
      - name: Give the Keychain tests a keychain of their own
        run: |
          set -euo pipefail
          # Read the search list BEFORE anything mutates it: setting the default
          # keychain rewrites the list as a side effect, so asking afterwards
          # returns a list that already has the new one in it and loses the
          # runner's own.
          existing=$(security list-keychains -d user | tr -d ' "')
          security create-keychain -p ci-throwaway tapscribe-ci.keychain
          # No flags is literally "no-timeout": a fresh keychain defaults to
          # lock-on-sleep with a 300s fuse, which is shorter than this job, and
          # -l/-u would keep locking enabled rather than turn it off.
          security set-keychain-settings tapscribe-ci.keychain
          security unlock-keychain -p ci-throwaway tapscribe-ci.keychain
          security default-keychain -s tapscribe-ci.keychain
          security list-keychains -d user -s tapscribe-ci.keychain $existing
          security list-keychains

      # Also on ubuntu, where [RequiresMacOS] skips. Here it runs.
      - name: Test the macOS platform layer
        run: dotnet test bridges/tray-bridge/tests/TapScribe.Bridge.MacOS.Tests/TapScribe.Bridge.MacOS.Tests.csproj -c Release

      # References the shell, so this builds the .app and then asserts against the
      # bundle it produced. It covers the "Build the macOS tray shell" step, which
      # stays anyway: a compile break should read as a build failure, not as a
      # test project that could not restore.
      - name: Test the macOS tray shell
        run: dotnet test bridges/tray-bridge/tests/TapScribe.TrayBridge.MacOS.Tests/TapScribe.TrayBridge.MacOS.Tests.csproj -c Release

      - name: Build the macOS tray shell
        run: dotnet build bridges/tray-bridge/src/TapScribe.TrayBridge.MacOS/TapScribe.TrayBridge.MacOS.csproj -c Release

      # The claim the install story rests on, asserted rather than believed.
      #
      # Our bundle is ad-hoc signed (the .NET macOS SDK does that, and arm64 will
      # not execute a wholly unsigned one), and a signature that fails to validate
      # reads to Gatekeeper as tampering: a QUARANTINED ad-hoc bundle is reported
      # as "damaged" with only Move to Trash, so the zip download has no in-UI way
      # forward at all. Quarantine is applied by the downloading browser and
      # propagated to a zip's contents when it is expanded, but `installer` writes
      # payload outside that path. If that holds, shipping a .pkg moves the user
      # from a dead end to the ordinary "unidentified developer" flow, for free.
      #
      # Apple documents none of this, so it is exactly the kind of claim that
      # quietly stops being true. Here rather than in release.yml because a policy
      # change should fail a PR, not a tag. Needs root, which is why it is a job
      # step and not a test in TapScribe.TrayBridge.MacOS.Tests: the runners have
      # passwordless sudo and a developer's Mac should not.
      - name: Prove installer-written payload is not quarantined
        run: |
          set -euo pipefail
          app=$(find bridges/tray-bridge/src/TapScribe.TrayBridge.MacOS/bin/Release \
            -maxdepth 3 -type d -name 'TapScribe.app' -not -path '*/publish/*')
          # Exactly one match, and NO match fails: the build above guarantees the
          # bundle, so an empty result means the path drifted rather than that
          # there is nothing to check. `wc -l` alone would not catch it, since
          # echoing an empty variable still counts as one line.
          test -n "$app"
          test "$(printf '%s' "$app" | grep -c '')" = 1
          test -d "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'

          # The SAME script release.yml ships with, so this gate cannot drift
          # into testing a package nobody downloads.
          bridges/tray-bridge/tools/build-macos-pkg.sh "$app" 0.0.0 probe.pkg
          # What a browser stamps on a download. Asserted present before the
          # install, so a silently unstamped pkg cannot make the check vacuous.
          xattr -w com.apple.quarantine '0083;00000000;Safari;ci-probe' probe.pkg
          xattr -p com.apple.quarantine probe.pkg

          sudo installer -pkg probe.pkg -target /
          installed=/Applications/TapScribe.app
          # Named failures, not bare `test`: a silent one-line exit says only
          # that the step failed, and this pair caught a real relocation bug
          # whose diagnosis took a local repro it should not have needed.
          if [ ! -d "$installed" ]; then
            echo "FAIL: nothing at $installed after a successful install."
            echo "The package's install-location was ignored, which is what a"
            echo "<relocate> entry in its PackageInfo does. Check that"
            echo "build-macos-pkg.sh still clears BundleIsRelocatable."
            exit 1
          fi
          if [ ! -x "$installed/Contents/MacOS/TapScribe" ]; then
            echo "FAIL: the installed bundle has no executable at Contents/MacOS/."
            exit 1
          fi

          # The claim, spelled as an explicit failure branch rather than as a
          # command whose non-zero exit happens to mean "clean": a grep that finds
          # nothing and a grep that could not run look the same to `set -e`.
          if xattr -lr "$installed" | grep -q com.apple.quarantine; then
            echo "FAIL: installer propagated com.apple.quarantine to the payload."
            echo "The .pkg buys nothing over the zip, and the install docs need the xattr step."
            xattr -lr "$installed" | grep com.apple.quarantine
            exit 1
          fi
          echo "OK: a quarantined unsigned .pkg installs an unquarantined bundle."

      # Nothing else runs the shell. The AppKit half carries no unit tests by
      # design (it cannot: the bindings fault under the VSTest host), so a
      # delegate or a status item that throws on launch passes every gate above:
      # they compile it, package it and install it without starting it once.
      #
      # The INSTALLED bundle, because that is what an operator double-clicks:
      # ad-hoc signed, written by `installer`, running from /Applications.
      #
      # HOME is redirected for a reason, not for tidiness: a Keychain call that
      # wants to prompt BLOCKS instead of failing, and a fresh HOME has no
      # stored token, so the read answers errSecItemNotFound and returns.
      #
      # If this ever fails for a reason that is about the runner rather than the
      # code (no window server for an LSUIElement app, say), delete it. A launch
      # gate that has to be retried is worse than none.
      # The Bundle's packaging script, RUN — for the same reason `bundle-build`
      # exists on the Windows side: the release job that uses it fires on a tag
      # only, so without this a break here is discovered on release day. `bash -n`
      # is not a substitute; the staging, the re-sign and the delegation are the
      # parts that go wrong.
      #
      # A STUB payload, not python-build-standalone. What is under test is where
      # the files land and whether the signature survives being written over —
      # neither is a function of 300 MB, and pulling that into every PR would buy
      # nothing. (The interpreter's own Mach-O dylibs under Resources are the one
      # thing this cannot stand in for: `codesign --deep` over a real tree is a
      # task-36 watch item.)
      #
      # Deliberately NOT installed: the quarantine and launch proofs above use the
      # bridge-only package on purpose, because launching a payload-bearing app
      # would boot the host role against a fake interpreter — a different test,
      # and a flakier one.
      - name: Prove the Bundle package script stages a payload
        run: |
          set -euo pipefail
          app=$(find bridges/tray-bridge/src/TapScribe.TrayBridge.MacOS/bin/Release \
            -maxdepth 3 -type d -name 'TapScribe.app' -not -path '*/publish/*')
          test -n "$app"

          stub=$(mktemp -d)
          mkdir -p "$stub/python/bin"
          printf '#!/bin/sh\necho stub\n' > "$stub/python/bin/python3"
          chmod +x "$stub/python/bin/python3"
          : > "$stub/tapscribe-0.0.0-py3-none-any.whl"

          packaging/macos/build-bundle-pkg.sh \
            "$app" "$stub/python" "$stub/tapscribe-0.0.0-py3-none-any.whl" 0.0.0 bundle-probe.pkg

          # The three-way contract: BundleLayout.MacOSPayload looks in
          # Contents/Resources, the tray's role probe asks the same path, and the
          # script puts it there. Asserted against the PACKAGE's payload rather than
          # the staging directory, which is what an operator actually installs.
          expanded=$(mktemp -d)
          pkgutil --expand bundle-probe.pkg "$expanded/pkg"
          payload=$(find "$expanded/pkg" -name Payload -maxdepth 2 | head -n 1)
          test -n "$payload"
          listed=$(tar -tzf "$payload")
          for want in \
            "TapScribe.app/Contents/Resources/python/bin/python3" \
            "TapScribe.app/Contents/Resources/wheel/tapscribe-0.0.0-py3-none-any.whl"; do
            if ! printf '%s\n' "$listed" | grep -q "$want"; then
              echo "FAIL: the package has no $want."
              echo "BundleLayout.MacOSPayload would read this install as a bridge-only tray,"
              echo "so the operator's Recorder would simply be absent from the menu."
              exit 1
            fi
          done
          echo "OK: the Bundle package carries its payload where the layout looks for it."

      - name: Prove the installed app launches
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bin=/Applications/TapScribe.app/Contents/MacOS/TapScribe
          HOME=$(mktemp -d) "$bin" > launch.log 2>&1 &
          pid=$!
          # A crash on launch is immediate, so this is a grace period rather than
          # a race: past the delegate, the status item and the first settings load.
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            echo "FAIL: the app exited $status within 10s of launching."
            cat launch.log
            exit 1
          fi
          kill "$pid"
          echo "OK: the installed bundle launched and stayed up."

  # Guards the bridge-core's cross-platform invariant: the core (resampler, /tap
  # WS client, control client) must build and its tests run with no Windows
  # dependency. Building only the test project — which references the core and
  # never the WASAPI/WinForms projects — on Linux fails the moment the core
  # takes a Windows dependency, since the net*-windows projects can't build
  # here. The in-process /tap test server uses Kestrel, so it runs on Linux too.
  #
  # The Mac platform layer rides the same lane for the same reason: it is
  # net10.0, so its policy is gated on every PR rather than only on the Mac.
  dotnet-core-crossplatform:
    name: dotnet core cross-platform (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: bridges/tray-bridge/global.json

      - name: Build + test bridge-core only
        run: dotnet test bridges/tray-bridge/tests/TapScribe.Bridge.Core.Tests/TapScribe.Bridge.Core.Tests.csproj -c Release

      # The Mac platform layer is net10.0: the floor is Version arithmetic and the
      # version read is a libc P/Invoke, so it needs neither Xcode nor the macos
      # workload. Running it here gates Mac policy on the lane every PR crosses.
      # The tests that ask the running OS itself carry [RequiresMacOS] and skip at
      # discovery, each naming the capability it wanted in its skip reason; the
      # macos job is where they run. That skip list is the enumeration, so this
      # comment deliberately does not keep a second one in prose.
      - name: Build + test the macOS platform layer
        run: dotnet test bridges/tray-bridge/tests/TapScribe.Bridge.MacOS.Tests/TapScribe.Bridge.MacOS.Tests.csproj -c Release

  # The Windows Bundle (packaging/bundle/, ADR-0015) uses the same
  # Core/Windows split as the tray Bridge above and for the same reason: the
  # path resolution, argv construction, log-rotation policy and password read
  # live in a cross-platform Core so they're testable off Windows. Only the
  # tray, the Job Object and the actual spawn are Windows-only, and those are
  # covered by the compile in `bundle-build` below.
  bundle-core-crossplatform:
    name: bundle core (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: packaging/bundle/global.json

      - name: Build + test bundle-core only
        run: dotnet test packaging/bundle/tests/TapScribe.Bundle.Core.Tests/TapScribe.Bundle.Core.Tests.csproj -c Release

      # Both platform halves COMPILE here, which is the whole reason neither carries a
      # platform TFM: a DllImport into kernel32 or libc needs none. Nothing referenced by
      # Bundle.Core.Tests reaches them, so without this step the macOS reaper's only
      # compile gate would be the one CI job that can build the macOS shell — and the
      # Windows one's would be the windows job. A build, not a test: their behaviour is
      # kernel behaviour, asserted where the kernel is.
      - name: Compile both platform reapers
        run: |
          dotnet build packaging/bundle/src/TapScribe.Bundle.MacOS/TapScribe.Bundle.MacOS.csproj -c Release
          dotnet build packaging/bundle/src/TapScribe.Bundle.Windows/TapScribe.Bundle.Windows.csproj -c Release

  # Builds the Bundle solution on its native OS: the cross-platform Core (already
  # tested above) plus the Windows reaper, whose kernel behaviour only Windows can
  # answer for. The release `bundle` job runs on a tag only, so without this a
  # break here would not be discovered until release day.
  bundle-build:
    name: bundle build + reaper tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: packaging/bundle/global.json

      - name: Build the whole bundle solution
        run: dotnet build packaging/bundle/TapScribe.Bundle.slnx -c Release

      # The reaper's Windows half. Its tests are [RequiresWindows] and skip
      # everywhere else, so this job is the only place they actually run —
      # JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE and self-enrolment are kernel
      # behaviour no Linux leg can answer for.
      - name: Test the Windows reaper
        run: dotnet test packaging/bundle/tests/TapScribe.Bundle.Windows.Tests/TapScribe.Bundle.Windows.Tests.csproj -c Release --no-build

  # The cross-platform job above runs the bridge-core tests but SKIPS the
  # real-Recorder meeting E2E (RealRecorderMeetingE2ETests, via the
  # RequiresPythonAsr attribute) because it has no Python ASR stack. This job
  # installs that stack so the E2E actually RUNS: the real Core clients drive a
  # real Python Recorder over /tap with two fixture-fed speakers (Norwegian +
  # English) and the real strip -> transcribe -> summarize pipeline — proving the
  # tray bridge does a multi-person, multi-language meeting end to end on Linux.
  dotnet-tray-meeting-e2e:
    name: tray bridge meeting E2E (ubuntu, full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tapscribe runtime + faster-whisper
        run: |
          pip install -e ".[whisper-cpu]"
          # silero-vad pulls torch/torchaudio from PyPI whose native libs can
          # mismatch; pin the CPU build last so torchaudio's extension loads
          # (same fix as the bridge-meeting-e2e job).
          pip install --force-reinstall torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Pre-fetch the ASR models (keep downloads out of the test's time budget)
        run: |
          python -c "from faster_whisper import WhisperModel; WhisperModel('base', device='cpu', compute_type='int8')"
          python -c "from tapscribe.nb_whisper import download_nb_whisper_ct2_dir as d; d('nb-whisper-tiny')"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: bridges/tray-bridge/global.json

      - name: Run the tray-bridge meeting E2E (real Recorder, real ASR)
        env:
          TAPSCRIBE_PYTHON: python
        run: >
          dotnet test
          bridges/tray-bridge/tests/TapScribe.Bridge.Core.Tests/TapScribe.Bridge.Core.Tests.csproj
          -c Release
          --filter "FullyQualifiedName~RealRecorderMeetingE2ETests"

  # Browser UI E2E with headless Chromium: the dashboard (active-taps / live
  # transcripts / merged-session pipeline via FakeTranscriber + synthetic WAVs)
  # AND the /setup page smoke (renders the family picker + backend selects with
  # no console errors). The @pytest.mark.real_audio dashboard variant streams
  # committed fixtures through a real faster-whisper — skipped in CI because it
  # pulls a model and would balloon job time; run locally for the README shot.
  playwright:
    name: browser UI E2E (synthetic only)
    runs-on: ubuntu-latest
    # Bounded against a wedged Chromium download, as bridge-e2e above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime + Playwright
        run: |
          python -m pip install --upgrade pip
          # Same install as the `test` job, plus playwright. No faster-whisper —
          # `FakeTranscriber` covers the synthetic path.
          #
          # This list previously omitted `onnxruntime`, which is core since #374:
          # the per-tap TapScribe gate could not construct, so it fell back to
          # passthrough and the browser legs exercised a no-op VAD without saying
          # so. `pip install -e .` makes that class of omission unwritable.
          pip install -e . pytest pytest-asyncio pytest-cov httpx hypothesis ruff playwright

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run synthetic browser E2E (dashboard + setup)
        # -m "not real_audio" skips the dashboard real-audio variant; test_setup_ui
        # carries no real_audio markers, so all of its smoke + regression run.
        run: pytest tests/e2e/test_dashboard_ui.py tests/e2e/test_setup_ui.py -q -m "not real_audio"

  # Static security smells in the application code — bandit. Separate
  # from CodeQL (which runs in its own workflow) because bandit is cheap
  # and gives PR-level feedback without waiting on the CodeQL pipeline.
  bandit:
    name: bandit security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install bandit
        # bandit needs the `[toml]` extra to read its `[tool.bandit]`
        # config out of pyproject.toml — without it, the -c flag below
        # silently falls back to "no config" and the by-design skips
        # don't apply.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[toml]>=1.7"

      - name: Run bandit
        # `-r` scan tapscribe/ recursively; `-ll` severity-level
        # medium+ (low-severity is noise from "you used assert" etc.);
        # `-c pyproject.toml` loads our `[tool.bandit] skips` block.
        run: bandit -r tapscribe -ll -c pyproject.toml

  # Known-CVE scan of declared Python dependencies via pip-audit. Reads
  # `pyproject.toml` so dependency floors are honoured. Runs separately
  # from the test matrix so a fresh CVE doesn't block functional CI.
  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        # The pip-audit action can't parse `pyproject.toml` directly (it
        # expects requirements.txt syntax), so install the runtime deps
        # into the runner's env and freeze the resolved set for the audit
        # (below). We skip the heavy `[whisper] / [voxtral] / [mlx]`
        # optional extras — operators opt into those on a per-deploy basis
        # and the vulnerability surface that matters for
        # tapscribe-the-server is the runtime deps only.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Exclude ML inference engines from audit
        # torch and silero-vad are ML inference engines whose security model
        # is "don't load untrusted models" — not "patch network-reachable
        # RCEs". Their PYSEC advisories are almost all local-only exploits in
        # rarely-called internals (jit, profiler, quantisation), and the
        # advisory database rarely records a fixed_in version, so pip-audit
        # flags every installed version indefinitely regardless of whether the
        # issue was actually fixed upstream. Auditing them produces permanent
        # noise that drowns out real findings in the server-facing deps
        # (fastapi, uvicorn, cryptography, websockets) — which is what this
        # job is actually here to catch.
        run: pip uninstall -y torch silero-vad

      - name: Freeze TapScribe's resolved dependency closure for the audit
        # The pip-audit action installs pip-audit — and its own transitive
        # deps (requests, urllib3, cyclonedx-python-lib, rich, …) — into
        # this same environment. With `local: true` those tooling deps get
        # audited alongside ours: noise unrelated to TapScribe's runtime
        # surface, and a recurring source of red CI when a CVE lands in one
        # of them (e.g. urllib3 CVE-2026-44431 / CVE-2026-44432). Freeze our
        # closure *before* the action installs pip-audit, then point the
        # audit at the frozen file (see `inputs` below) so it scans only
        # what `pip install -e .` actually pulled in. `--exclude-editable`
        # drops the tapscribe self-reference (not on PyPI; nothing to audit).
        run: pip freeze --exclude-editable > audit-requirements.txt

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          # Audit only TapScribe's frozen closure, not the live runner env
          # (which also carries pip-audit's own deps). The freeze is fully
          # pinned, so `no-deps` audits exactly those resolved versions.
          inputs: audit-requirements.txt
          no-deps: true
