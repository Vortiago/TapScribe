name: CI

on:
  push:
    # Run on main (post-merge) and on any feature branch — including the
    # `claude/**` branches the Claude-Code integration pushes — so the
    # underlying push event triggers CI even when the PR was opened by a
    # bot whose pull_request events don't trigger workflows.
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [main]
  # Allow the operator to manually re-run from the Actions tab — useful
  # when a PR was opened by an integration whose token doesn't trigger
  # the pull_request event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          # We only install the lightweight dependencies needed to run the
          # unit tests — no torch / faster-whisper / mlx-whisper. The tests
          # are scoped to pure helpers that don't need a real model loaded.
          # `cryptography` is needed so test_tls runs (the test itself uses
          # pytest.importorskip, so omitting it just silently skips
          # coverage of the --tls boot path).
          pip install fastapi uvicorn python-multipart numpy websockets pytest pytest-asyncio pytest-cov httpx hypothesis ruff cryptography

      - name: Lint (ruff)
        run: ruff check tapscribe tools tests bridges/local-test-bridge

      - name: Run tests
        run: pytest tests -q --cov=tapscribe --cov-report=term-missing

  # The bridge is plain JS with no Python dependency, so it runs in its
  # own job — decoupled from the pytest matrix so a Python flake doesn't
  # hide a real bridge regression (and vice versa). Node 22 only: the
  # bridge ships as a Chrome extension (V8, not Node), so this job is
  # purely test infra and there's no reason to support older Node.
  bridge-js:
    name: bridge JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run bridge tests (Node built-in runner, no deps)
        run: node --test "bridges/spacialchat-bridge/tests/*.test.js"

  # Dashboard UI E2E with headless Chromium. The synthetic variant
  # (FakeTranscriber + synthetic WAVs) verifies the active-taps / live
  # transcripts / merged-session pipeline end-to-end. The
  # @pytest.mark.real_audio variant streams committed fixtures through a
  # real faster-whisper — skipped in CI because it pulls a model and
  # would balloon job time; run locally for the screenshot in README.
  playwright:
    name: dashboard UI E2E (synthetic only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime + Playwright
        run: |
          python -m pip install --upgrade pip
          # Same lightweight set as the `test` job, plus playwright. No
          # faster-whisper — `FakeTranscriber` covers the synthetic path.
          pip install fastapi uvicorn python-multipart numpy websockets pytest pytest-asyncio pytest-cov httpx hypothesis ruff cryptography playwright

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run synthetic dashboard E2E
        # -m "not real_audio" skips the real-audio variant; -k '' would
        # match every test, so we rely on the marker filter alone.
        run: pytest tests/e2e/test_dashboard_ui.py -q -m "not real_audio"

  # Static security smells in the application code — bandit. Separate
  # from CodeQL (which runs in its own workflow) because bandit is cheap
  # and gives PR-level feedback without waiting on the CodeQL pipeline.
  bandit:
    name: bandit security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bandit
        # bandit needs the `[toml]` extra to read its `[tool.bandit]`
        # config out of pyproject.toml — without it, the -c flag below
        # silently falls back to "no config" and the by-design skips
        # don't apply.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[toml]>=1.7"

      - name: Run bandit
        # `-r` scan tapscribe/ recursively; `-ll` severity-level
        # medium+ (low-severity is noise from "you used assert" etc.);
        # `-c pyproject.toml` loads our `[tool.bandit] skips` block.
        run: bandit -r tapscribe -ll -c pyproject.toml

  # Known-CVE scan of declared Python dependencies via pip-audit. Reads
  # `pyproject.toml` so dependency floors are honoured. Runs separately
  # from the test matrix so a fresh CVE doesn't block functional CI.
  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        # The pip-audit action can't parse `pyproject.toml` directly (it
        # expects requirements.txt syntax), so install the runtime deps
        # into the runner's env and audit what's actually installed. We
        # skip the heavy `[whisper] / [voxtral] / [mlx]` optional extras
        # — operators opt into those on a per-deploy basis and the
        # vulnerability surface that matters for tapscribe-the-server
        # is the runtime deps only.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Exclude ML inference engines from audit
        # torch and silero-vad are ML inference engines whose security model
        # is "don't load untrusted models" — not "patch network-reachable
        # RCEs". Their PYSEC advisories are almost all local-only exploits in
        # rarely-called internals (jit, profiler, quantisation), and the
        # advisory database rarely records a fixed_in version, so pip-audit
        # flags every installed version indefinitely regardless of whether the
        # issue was actually fixed upstream. Auditing them produces permanent
        # noise that drowns out real findings in the server-facing deps
        # (fastapi, uvicorn, cryptography, websockets) — which is what this
        # job is actually here to catch.
        run: pip uninstall -y torch silero-vad

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          # `local: true` audits the packages installed in this runner's
          # Python environment. Resolved versions, deterministic results.
          local: true
