name: install matrix

# Real `pip install -e .[…]` across every supported OS + every model
# family. Catches install regressions before an operator does — PR #61
# removed `canary-mlx` and an operator's saved `backend=mlx` silently
# fell back to `canary-cpu` → NeMo → kaldialign → cmake build failure
# on macOS, which no unit test caught because none of them ran pip.
#
# Path-gated to install-affecting files only: NeMo + torch downloads
# are multi-GB per job, so we don't pay this cost on every PR.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'pyproject.toml'
      - 'tapscribe/install_picker.py'
      - 'start.sh'
      - 'start.ps1'
      - '.github/workflows/install-matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'tapscribe/install_picker.py'
      - 'start.sh'
      - 'start.ps1'
      - '.github/workflows/install-matrix.yml'
  # Daily cron so PyPI drift surfaces here, not in an operator's terminal.
  # The original `kaldialign 0.10.0` drop-of-macOS-wheels failure didn't
  # touch any path-gated file in this repo, so the path-gated triggers
  # above would never have caught it. A scheduled run catches that whole
  # class of regression.
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install (${{ matrix.os }} · py${{ matrix.python-version }} · ${{ matrix.family }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Per-family split so a failure points at the responsible
        # extra in the PR check list, not a single opaque "matrix
        # failed" red mark.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `start.sh` prefers `python3.13` over `python3.12`, so 3.13 is
        # the version an operator with a current Homebrew Python actually
        # hits. We test both because pyproject.toml declares
        # `requires-python = ">=3.12"` and the Apple-Silicon wheel matrix
        # for transitive deps (e.g. kaldialign) sometimes covers one
        # without the other.
        python-version: ["3.12", "3.13"]
        family: [whisper, voxtral, parakeet, summarize]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # Wheel cache is orthogonal to dependency resolution — pip
          # still re-resolves the graph on every run, the cache just
          # skips re-downloading the multi-GB torch / NeMo wheels.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify cmake on PATH (cross-OS)
        # llama-cpp-python (the `summarize` family's non-macOS backend) falls
        # back to a from-source build — needing cmake + a C++ toolchain — if
        # the prebuilt-wheel index below doesn't have a match for this
        # OS/Python combo. All three runner images currently ship cmake, but
        # surfacing the version up-front means a future image change that
        # drops it fails here with a legible message rather than 100 lines
        # into a pip build log.
        shell: bash
        run: |
          if ! command -v cmake >/dev/null; then
            echo "cmake not on PATH — installing for ${RUNNER_OS}"
            case "$RUNNER_OS" in
              Linux)   sudo apt-get update && sudo apt-get install -y cmake build-essential ;;
              macOS)   brew install cmake ;;
              Windows) echo "no automatic install path on Windows runner; failing"; exit 1 ;;
            esac
          fi
          cmake --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Picker dry-run sanity
        # Cheap fast-fail: catches alias-references-removed-atomic-extra
        # regressions in the picker's argv composition before we pay
        # the multi-GB install download.
        run: python -m tapscribe.install_picker --dry-run --non-interactive

      - name: Install tapscribe + ${{ matrix.family }} extra
        # `summarize` on non-macOS pulls llama-cpp-python, which builds from
        # source by default (needs cmake + a C++ toolchain — see the "Verify
        # cmake on PATH" step above). Mirror start.sh / start.ps1's own
        # SUMMARIZE_PIP_ARGS logic and pass the maintainer's prebuilt
        # CPU-wheel index so this job matches what an operator's bring-up
        # actually runs, not a naive install. `shell: bash` so the same
        # conditional runs on the Windows runner too (default shell there is
        # pwsh).
        shell: bash
        run: |
          extra_args=()
          if [ "${{ matrix.family }}" = "summarize" ] && [ "${{ matrix.os }}" != "macos-latest" ]; then
            extra_args+=(--extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu)
          fi
          python -m pip install -e ".[${{ matrix.family }}]" "${extra_args[@]}"

      - name: Verify package import
        run: python -c "import tapscribe; print(tapscribe.__name__, 'OK')"
