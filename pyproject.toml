[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapscribe"
version = "1.1.0"
description = "Local-first transcription recorder + operator dashboard built on Whisper."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    # Used as a *client* by the Recorder to relay /tap bytes into its
    # supervised WhisperLiveKit child (see tapscribe.live_relay). FastAPI
    # gives us a WS server; this gives us the matching client.
    "websockets>=12",
    # Required by `--tls` for the self-signed cert path. Pure-wheel on
    # every platform we support; tiny next to torch/whisperlivekit, and
    # the bridge needs wss:// for any non-localhost recorder (browsers
    # block ws:// from https://app.spatial.chat as mixed content), so
    # TLS is effectively the happy path — not optional enough to gate.
    "cryptography>=42",
    # onnxruntime runs the vendored Silero VAD model behind
    # `tapscribe.vad`, which powers two core operator features: the live
    # SpeechGate (tapscribe/speech_gate.py) and strip-silence's region
    # detector (tapscribe/strip_silence.py).
    #
    # NOT the `silero-vad` package, and NOT torch (#374). Upstream declares
    # torch + torchaudio as HARD requirements and imports them at module
    # level even when the model is loaded with `onnx=True` — while using
    # torch purely as an array container. That made ~500 MB (CPU) to
    # ~2.5 GB (CUDA) a core dependency of every install, and the single
    # largest component of the Windows Bundle payload (ADR-0015). The port
    # in `tapscribe/vad/` is pinned against the real package by
    # `tests/test_vad_silero_port.py`, which asserts identical output.
    #
    # torch is still needed by some MODEL backends (voxtral, parakeet-cpu)
    # and by the live channel's whisperlivekit — those declare it in their
    # own extras, so it installs when an operator picks a family that
    # needs it rather than unconditionally.
    "onnxruntime>=1.17",
]

[project.urls]
Homepage = "https://github.com/Vortiago/TapScribe"
Repository = "https://github.com/Vortiago/TapScribe"
Issues = "https://github.com/Vortiago/TapScribe/issues"

[project.optional-dependencies]
# The actual model backends are heavy and platform-dependent; keep them
# optional so a CI / docs install doesn't pull in PyTorch + CUDA.
#
# The picker (tapscribe/install_picker.py) composes per-family backend
# selections from these atomic extras: each family has a "shared" extra
# (always installed when the family is on) plus one or two backend-
# specific extras (CPU/CUDA and/or MLX) which the operator can opt into
# independently. Keep the family/backend split explicit here so a stray
# `pip install -e .[parakeet-mlx]` on a Linux box doesn't drag in NeMo.

# --- Whisper / NB-Whisper ---------------------------------------------------
# Live channel needs whisperlivekit no matter which backend drives it;
# faster-whisper covers the CPU/CUDA path; mlx-whisper covers Apple
# Silicon. mlx-whisper's PyPI release line tops out at 0.4.x — a `>=0.5`
# floor is unsatisfiable, so don't tighten this without checking PyPI.
whisper-live = ["whisperlivekit>=0.1"]
whisper-cpu = ["faster-whisper>=1.0"]
whisper-mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

# --- Voxtral (Mistral) ------------------------------------------------------
# CPU/CUDA only — no published MLX adapter on PyPI as of 2026-05.
voxtral-cpu = ["transformers>=4.46", "torch>=2.1", "mistral-common>=1.5"]

# --- Parakeet TDT 0.6B v3 ---------------------------------------------------
# Two independent adapters; no shared piece between them.
parakeet-cpu = [
    # Parakeet-TDT via Hugging Face transformers (CUDA / CPU). transformers
    # v5+ ships native `ParakeetForTDT` / `AutoProcessor`; `librosa` backs
    # the feature extractor's log-mel. Far lighter than the old NeMo path
    # (no PyTorch-Lightning / Hydra) and — crucially — carries NO
    # `kaldialign` transitive pin, so it installs cleanly on every platform.
    # That retires the whole macOS NeMo<2.6 + kaldialign wheel-window dance.
    # The adapter relies on `AutoModelForTDT.generate(...,
    # return_dict_in_generate=True)` + `processor.decode(sequences,
    # durations=...)` for token timestamps; an importorskip smoke test
    # (tests/test_transcribers_parakeet.py) guards those symbols, so bump
    # the upper bound deliberately after auditing the upstream changelog.
    "transformers>=5.12,<6",
    "librosa>=0.10",
    "torch>=2.1",
]
parakeet-mlx = [
    # Upper bound: `tapscribe.transcribers.mlx_parakeet` relies on
    # `parakeet_mlx.audio.get_logmel` and the model's `generate(mel)` entry
    # point to side-step the bundled ffmpeg-based loader (see
    # `tapscribe/wav_predecode.py`). Those names are not part of the
    # README-documented public API, so a major-version bump that
    # relocates them would silently regress every batch transcribe to
    # needing ffmpeg on PATH. Bump the cap deliberately after auditing
    # the upstream changelog.
    "parakeet-mlx>=0.5,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# --- Moonshine (Useful Sensors / Moonshine AI) — live-only, see PRD #120 ----
# Two independent runtimes behind `tapscribe.moonshine_live.MoonshineLiveChannel`;
# no shared piece between them (same shape as the Voxtral/Parakeet pairs).
moonshine-mlx = [
    # Upper bound: `tapscribe.transcribers.moonshine_mlx` relies on
    # `mlx_audio.stt.load` + `Model.generate(array) -> STTOutput` — the
    # Moonshine port landed around v0.4.1 and is young/drift-prone (same
    # library this repo already uses for Canary). Bump the cap deliberately
    # after auditing the upstream changelog.
    "mlx-audio>=0.4.1,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
moonshine-cpu = [
    # `useful-moonshine-onnx` (top-level module `moonshine_onnx`) — the
    # ONNX-CPU runtime `tapscribe.transcribers.moonshine_onnx` drives via
    # `MoonshineOnnxModel(...).generate(audio)` + `load_tokenizer().decode_batch(...)`.
    # Pure ONNX/numpy, no torch. Date-based upstream versioning (the only
    # releases as of writing are 20251120/20251121); the upper bound is a
    # calendar-year window rather than a semver cap for the same reason —
    # bump deliberately after auditing the upstream changelog.
    "useful-moonshine-onnx>=20251120,<20270101",
]

# --- CUDA runtime libs (faster-whisper / CTranslate2 GPU path) --------------
# CUDA runtime libs for the faster-whisper / CTranslate2 GPU path. CTranslate2
# does NOT bundle cuBLAS/cuDNN (unlike Torch, which ships its own), so the
# Whisper CPU/CUDA backend can't use the GPU without them — the operator's
# "cublas64_12.dll is not found" on Windows+CUDA. The install picker appends
# this extra automatically when nvidia-smi is present AND a Whisper CPU/CUDA
# backend is selected. Not published for macOS (no CUDA there).
cuda-libs = [
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12; sys_platform != 'darwin'",
]

# --- Summarizer · bundled offline Local model (#86) -------------------------
# The Local summarizer source runs a bundled Gemma model with no network,
# hardware-routed at runtime by `tapscribe.summarizers.LocalSummarizer`: an MLX
# backend (Gemma 3 4B) on Apple Silicon, a GGUF/llama.cpp backend (Gemma 4 E4B)
# on CPU/CUDA (and any non-Apple-Silicon box) — the two paths run different
# models for now; see the divergence note on LOCAL_MLX_MODEL in summarizers.py. Unlike the transcription extras,
# this is installed at STARTUP via the recorder's runtime-deps step (start.sh /
# start.ps1) — NOT by tapscribe/install_picker.py (which resolves transcription
# model extras only) and NOT as a per-request preflight. The imported upstream
# symbols are guarded by importorskip smoke tests
# (tests/test_summarizers_local.py::test_{mlx_lm,llama_cpp}_upstream_contract);
# the narrow upper bounds here are the primary defence against an upstream API
# rename, the same convention as the MLX transcriber adapters.
summarize = [
    # MLX text generation (Apple Silicon). `mlx_lm.load` / `mlx_lm.generate`
    # are the entry points the adapter imports lazily. The package moves fast,
    # but load/generate are stable. The bundled MLX model is Gemma 3 4B (well
    # within this range); Gemma 4 E4B is deliberately NOT used here because its
    # E-series KV-sharing layout is unloadable by mlx-lm through 0.31.3 (the
    # latest) — see the divergence note on LOCAL_MLX_MODEL in summarizers.py.
    "mlx-lm>=0.31,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # GGUF via llama.cpp (CPU/CUDA, and everywhere that isn't Apple Silicon —
    # expressed by De Morgan, since PEP 508 markers have no unary `not`).
    # `Llama.from_pretrained` + `Llama.create_chat_completion` are the imported
    # entry points. Floor ≥0.3.26 guarantees the bundled llama.cpp carries the
    # Gemma-4 E-series architecture (in llama.cpp since the Apr-2026 launch);
    # bump freely within 0.3.x. NOTE: llama-cpp-python builds from source by
    # default — the startup step passes the prebuilt-CPU-wheel index so a fresh
    # box without a C++ toolchain still installs (see start.sh).
    "llama-cpp-python>=0.3.26,<0.4; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # Both backends fetch the bundled weights from the Hub on first Generate
    # (mlx `load` / llama.cpp `from_pretrained`); pin a floor so the download
    # API is present even on an otherwise-minimal install.
    "huggingface-hub>=0.24",
]

# --- Convenience aliases (back-compat) --------------------------------------
# Older docs, the Dockerfile, and test-skip messages still reference the
# pre-split umbrella names. They self-reference the atomic extras above
# so version-floor / env-marker changes only have to land in one place
# (the original bug — `mlx-whisper>=0.5` unsatisfiable on PyPI — was
# kept alive by a duplicate floor in the umbrella).
whisper = ["tapscribe[whisper-live,whisper-cpu,whisper-mlx]"]
mlx = ["tapscribe[whisper-mlx]"]
voxtral = ["tapscribe[voxtral-cpu]"]
# On Apple Silicon, parakeet-mlx is the natural backend (GPU-accelerated
# via Metal, ~2-3× faster than torch on CPU). Everywhere else the
# transformers CUDA/CPU backend (`parakeet-cpu`) applies. Split by platform
# so a mac install doesn't pull transformers when MLX is the path, and a
# Linux/Windows box doesn't pull the Apple-only parakeet-mlx wheel.
# Operators who explicitly want both backends can still pick "Both" in
# `tapscribe/install_picker.py`, which composes the atomic extras directly.
parakeet = [
    "tapscribe[parakeet-mlx]; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # PEP 508 marker grammar has no unary `not` (only `and`/`or` join
    # comparisons), so the "everywhere except Apple Silicon" condition
    # is expressed via De Morgan: not (A and B) ≡ (¬A or ¬B).
    "tapscribe[parakeet-cpu]; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
moonshine = [
    "tapscribe[moonshine-mlx]; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tapscribe[moonshine-cpu]; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.5",
    # Security smells in tapscribe/ — run in CI as a dedicated job.
    "bandit>=1.7",
    # Known-CVE scanner for declared dependencies — run in CI.
    "pip-audit>=2.7",
    # local-test-bridge dev tool — captures from the system mic and
    # streams to /tap. See bridges/local-test-bridge/README.md.
    "sounddevice>=0.4",
    # Real-audio fixture conversion (OGG → 16 kHz mono int16 WAV) and
    # the real-Whisper E2E test (tests/e2e/test_pipeline_e2e.py).
    "soundfile>=0.12",
    "scipy>=1.10",
    # Browser-driven dashboard E2E (tests/e2e/test_dashboard_ui.py).
    # After install, run: `python -m playwright install chromium`.
    "playwright>=1.40",
]

[project.scripts]
tapscribe = "tapscribe.__main__:main"

[tool.setuptools.packages.find]
include = ["tapscribe*"]

# Recursive globs (setuptools >= 62.3) so NESTED web assets ship in wheels:
# the old single-level globs silently dropped web/components/**, web/js/
# components/**, and web/js/next/** — editable installs (start.sh) masked it,
# but every built wheel / Docker image served a blank dashboard.
[tool.setuptools.package-data]
# The VAD model is CODE-adjacent data, not an optional asset: without it in the
# wheel, `tapscribe.vad.load_model` has nothing to open and both the live
# SpeechGate and strip-silence fail at first use — in a Bundle, with no terminal
# to say why. Same class of bug as the web/** globs below once were.
tapscribe = [
    "web/**/*.html",
    "web/**/*.css",
    "web/**/*.js",
    "web/js/types.d.ts",
    "vad/*.onnx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
# Treat warnings as errors. Anything new that surfaces is a real signal —
# a test leaking a task, a stdlib deprecation we should track, or a real
# bug. Ignores below are explicit, upstream-only, and tagged with the
# library so future cleanups can grep them out as the upstream fixes land.
filterwarnings = [
    "error",
    # uvicorn 0.27+ still imports the legacy websockets server protocol.
    # Tracked upstream in encode/uvicorn; remove when uvicorn migrates.
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:websockets\\.legacy is deprecated:DeprecationWarning",
    "ignore:remove second argument of ws_handler:DeprecationWarning",
    # (No torch.jit.load ignore needed: since #374 nothing in the core install
    #  imports torch at all — `speech_gate.load_silero_model` and
    #  `strip_silence._local_silero_model` both go through `tapscribe.vad`,
    #  which runs the vendored ONNX model on onnxruntime. The deprecated
    #  TorchScript loader is unreachable, not merely unused.)
    # starlette 1.x started nagging that `httpx` should become `httpx2`
    # in TestClient. fastapi.testclient -> starlette.testclient imports
    # raise this at module load, which breaks every collection that uses
    # TestClient under filterwarnings=error. The warning class is its own
    # `UserWarning` subclass (NOT a DeprecationWarning), so the filter
    # has to name it explicitly. Remove once starlette finalises the
    # httpx2 migration (or pins httpx2 itself).
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "real_audio: end-to-end test that streams real audio fixtures and runs a real transcription backend (Whisper via faster-whisper, or Parakeet via transformers). Skipped unless tests/fixtures/audio/ is populated and the backend's package is installed.",
    "chaos: race-condition / error-recovery test exercising background tasks, abnormal close paths, or repeated rapid mutations. Opt out with -m 'not chaos'.",
    "browser_e2e: requires Playwright + Chromium (`pip install -e .[dev] && python -m playwright install chromium`). Opt out with -m 'not browser_e2e'.",
    "real_silero: opt out of the autouse silero stub in tests/conftest.py — exercises the real `detect_speech_silero` import path (only set on tests that need it).",
    "real_pip: end-to-end test that creates a throwaway venv and runs a real `pip install -e` through the install picker. Self-skips when a trivial editable install can't be built (no network / no build backend). Opt out with -m 'not real_pip'.",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.bandit]
# B104 — binding to 0.0.0.0: TapScribe is an operator-opt-in LAN service.
#   The operator passes `--lan` (or `--host 0.0.0.0` to the Docker container)
#   to deliberately expose the dashboard. `tls.py` uses 0.0.0.0 as the
#   Common Name on the self-signed cert. None of these are accidental.
# B615 — unpinned Hugging Face downloads: NB-Whisper and Voxtral model
#   revisions intentionally float so model updates flow to operators
#   without code changes. Pinning to a SHA would buy supply-chain
#   integrity at the cost of every model update requiring a release.
skips = ["B104", "B615"]
