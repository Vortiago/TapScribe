[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapscribe"
version = "0.1.0"
description = "Local-first transcription recorder + operator dashboard built on Whisper."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
# The actual model backends are heavy and platform-dependent; keep them
# optional so a CI / docs install doesn't pull in PyTorch + CUDA.
whisper = ["faster-whisper>=1.0", "whisperlivekit>=0.1"]
mlx = ["mlx-whisper>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]
voxtral = ["transformers>=4.46", "torch>=2.1"]
vad = ["silero-vad>=5.0", "torch>=2.1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
tapscribe = "tapscribe.__main__:main"

[tool.setuptools.packages.find]
include = ["tapscribe*"]

[tool.setuptools.package-data]
tapscribe = ["web/*.html", "web/*.css", "web/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
